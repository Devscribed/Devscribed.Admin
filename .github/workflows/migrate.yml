name: Migrate database

# Runs on every merge into main rather than only when prisma/migrations changes:
# the runner is idempotent, so a no-op run costs one "nothing to apply" line, whereas a
# path filter that guesses wrong leaves the schema behind the code.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Two overlapping merges must not apply the same migration twice.
concurrency:
  group: migrate-main
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply migrations to Turso
        env:
          DATABASE_URL: libsql://teammerly-zalyz.aws-eu-west-1.turso.io
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: npm run db:migrate --workspace @devscribed/api
