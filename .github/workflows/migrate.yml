name: Migrate database

# Runs on every merge into main rather than only when prisma/migrations changes:
# `migrate deploy` is idempotent, so a no-op run costs one "No pending migrations" line,
# whereas a path filter that guesses wrong leaves the schema behind the code.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Two overlapping merges must not apply the same migration twice.
concurrency:
  group: migrate-main
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply migrations to Neon
        env:
          # Neon's *direct* (unpooled) endpoint. Prisma Migrate takes advisory locks and
          # runs DDL in transactions, neither of which survives pgbouncer, so this must
          # not be the -pooler host the application uses.
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: npm run db:migrate --workspace @devscribed/api
