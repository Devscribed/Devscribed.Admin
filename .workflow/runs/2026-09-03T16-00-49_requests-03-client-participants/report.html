ation-token.ts`, `apps/api/src/invitations/invitations.service.ts` |\n| Supersession — one live pending invitation per (email, org) | `apps/api/src/invitations/invitations.service.ts:105` (`updateMany` inside the create transaction) |\n| Port declared as an abstract class used as its own DI token | `apps/api/src/mail/mail.service.ts:152`, driver chosen in `apps/api/src/mail/mail.provider.ts`, registered global in `apps/api/src/core.module.ts` |\n| `FOR UPDATE` re-read + guard evaluated against that read | `apps/api/src/requests/requests.service.ts:848` (`lockRequest`) |\n| Append-only event writer, always takes the caller's `tx` | `apps/api/src/requests/request-events.service.ts` |\n| Request wire shape, `assignee.kind` already a column read | `apps/api/src/requests/requests.serializer.ts` |\n| Topic read → audience compare → assignee → project ordering | `apps/api/src/requests/requests.service.ts:317-400` |\n| `normalizeRole` / `hasCapability` / `can` / `canReadRequest` | `packages/validation/src/roles.ts`, `packages/validation/src/index.ts:763` |\n| Empty-catalogue picker + submit-not-drawn, per audience | `apps/web/app/org/[orgId]/requests/NewRequestModal.tsx:255-330` |\n| `Select` option `label` is a `React.ReactNode` | `1_DS for dev/components/forms/Select.d.ts:3` |\n| E2E helpers the cases need | `e2e/tests/helpers.ts` — `signupOrg`, `createBareAccount`, `latestInvitationToken`, `inviteAndAcceptViaApi`, `assignProjectMembersViaApi`, `createProjectViaApi`, `listRequestTopicsViaApi`, `archiveRequestTopicViaApi` |\n| Provider double in an integration test | `apps/api/test/clients.spec.ts:136`, `apps/api/test/requests.spec.ts:270` (`overrideProvider`) |\n\n## What must be built from zero\n\n- `ClientMembership` — model, migration, service, and the three contacts routes.\n- `RequestNotification` — the outbox table, its `@@unique([eventId, recipientKind, recipientId])`.\n- `RequestNotifier` — the port, `NullRequestNotifier`, the post-commit dispatcher.\n- `CLIENT_USER_MESSAGES` and the `ClientCapability` union + `CLIENT_CAPABILITIES` list in\n  `packages/validation/src/index.ts`. Neither name exists in the tree today (grepped).\n- Principal resolution: the second principal kind on the session, and the rule that decides\n  which organization routes a client principal may reach at all.\n- The `client` branches of sign-in, `/api/me` and invitation acceptance.\n- Web: the contacts section on client detail, the addressee-kind control and contact picker in\n  the new-request modal, and the client shell (sidebar gating + post-auth landing).\n\n---\n\n## Sweeps\n\n### Premises — every claim the spec makes about this repository, checked at the file\n\n| Claim | Verified at | Verdict |\n|---|---|---|\n| Migrations run before the services roll out; skipped on a web-only deploy | `infra/deploy.sh:175-185` (migrate, guarded on `api` being in `SERVICES`) then `:187-192` (`tf apply`) | true |\n| `GET /api/me` answers `null` for an account with no staff membership | `apps/api/src/members/me.controller.ts:27` | true |\n| The shell sends a `null` identity answer back to sign-in | `apps/web/app/org/[orgId]/layout.tsx:45-49` | true |\n| `nav-members` is drawn unconditionally | `apps/web/src/layout/Sidebar.tsx:71-77` | true |\n| Sign-in refuses an account with no active `Membership`, before the password compare | `apps/api/src/auth/login.service.ts:35-40` | true |\n| `hasCapability` normalizes an absent role to `viewer`, and `viewer` holds `ViewOwnRequests` | `packages/validation/src/roles.ts` (`normalizeRole`, `ROLE_CAPABILITIES.viewer`) | true |\n| `can` answers `false` for a role its matrix has no row for | `packages/validation/src/index.ts:763-765` | true |\n| The legacy `member` value therefore holds neither `manage-clients` nor `view-clients` | same; `CAPABILITY_MATRIX` is keyed `admin\\|manager\\|user\\|viewer` | true |\n| `manager` holds `manage-clients` and `view-clients` (TC-03-INT-12 needs it) | `packages/validation/src/index.ts` manager row | true |\n| The staff invitation's duplicate check reads staff rows only | `apps/api/src/invitations/invitations.service.ts:90-95` (`memberships` include) | true |\n| `Invitation.role` is a free-form `String`; `clientId` is a new nullable column | `apps/api/prisma/schema.prisma:109-133` | true |\n| `Request.assigneeMembershipId` is already nullable, `assigneeKind` a `String` | `apps/api/prisma/schema.prisma:1147-1151` | true |\n| `MailService` is an abstract class used as its own token | `apps/api/src/mail/mail.service.ts:152` | true |\n| Today's client-addressee refusal is `400 assigneeMembershipId: \"Choose who this request is for\"` | `packages/validation/src/requests.ts:219-231` (`REQUEST_ASSIGNEE_KINDS = ['member']`) | true — matches the probe transcript verbatim |\n| The modal already replaces the picker with `pickerEmpty` and draws no submit | `NewRequestModal.tsx:255-266`, `:281-292` | true |\n| `Select`'s option label may be a `ReactNode` (the DS-gaps \"no gap\" claim) | `1_DS for dev/components/forms/Select.d.ts:3` | true |\n| `apps/api/test/clients.spec.ts` replaces a provider with `overrideProvider` | `apps/api/test/clients.spec.ts:136` | true |\n\nNo stale premise found.\n\n### Contradiction sweep — the absolutes, against the call sites they forbid\n\n- *\"An account never holds an active `Membership` and an active `ClientMembership` at once\"* — the\n  writers are: client accept (REQ-03-014 refuses), staff invitation write and staff accept\n  (REQ-03-042 refuses), and `POST /api/signup`. Signup cannot reach it: `Account.email` is\n  `@unique` and `apps/api/src/signup/signup.service.ts:36` refuses an existing address, so a\n  client contact cannot sign up a second organization under the same address. The cell the table\n  marks unreachable has no third writer.\n- *\"A client principal is refused 404 on every organization route other than the ones REQ-03-019\n  names\"* — every controller mounted under `api/organizations/:orgId` already applies\n  `OrgScopeGuard` (checked: `grep -L OrgScopeGuard` over all of them returns nothing), so there is\n  one choke point and no route that escapes it. Listed in T3's `allCallSites`.\n- *\"The principal kind is asked before any role-keyed helper\"* — the call sites that would violate\n  it are enumerated in T3/T7's `allCallSites`. `RequestsService.requireCaller` (`:894`) currently\n  throws `Forbidden` for an account with no membership, which is the one a client principal\n  reaches first.\n- REQ-03-013 (any client of the organization, whatever the status) vs the state-machine row\n  `removed | invite` (an invitation is written): the row is the **same** client's removed row and\n  the contracts file says so in the paragraph under the table. No conflict.\n- REQ-03-011 (a contact invitation supersedes pending staff invitations) vs REQ-03-042 (a staff\n  invitation for a client contact is refused at write): REQ-03-042 keys on an **active\n  `ClientMembership`**, not on a pending invitation, so TC-03-INT-31's \"invite as a contact, then\n  as staff\" sequence is writable and both rules hold.\n- REQ-03-029 (`scope=all` → 200 for a client) vs the list route's `403 scopeForbidden`: the 403 is\n  reached only after the principal kind is resolved as staff. No conflict.\n\nNo contradiction found.\n\n### External claims\n\nThe spec's \"Access this needs\" table is a single row saying there is none, and the shipped\nadapter makes no outbound call. There is no `Assumed` observation carrying a requirement, so no\n`spec` finding is owed here. The doubles the cases register are of **our own port**, and\n`doubleBehaviours` is planned from the port's own table of members and outcomes, not from prose.\n\n### Call sites — the \"every X\" requirements\n\n- REQ-03-019 (\"every other organization route\") → the 17 controllers under\n  `api/organizations/:orgId`, listed in T3.\n- REQ-03-035 (\"every notifiable event\") → `createRequest:317`, `postMessage:465`,\n  `transition:534` (answer/grant/decline/cancel), `reassignRequest:756`. `patchRequest:625`\n  writes `field_changed`, which REQ-03-035's list does not name, so it notifies nobody.\n- REQ-03-017 (\"when a right is checked\") → API: `requests.service.ts:894`, `:130` (`can`),\n  `:283` (`canReadRequest`); web: `Sidebar.tsx:180`, `requests/page.tsx:117-119`,\n  `requests/[requestId]/page.tsx:47-49`, `requests-badge-context.tsx:41`.\n\n### Writers and locks\n\n- `Request.status` — the existing `SELECT … FOR UPDATE` re-read (`requests.service.ts:848`) is\n  the lock, and state-machine invariant 3 extends it unchanged to a client actor.\n- `Organization.nextRequestNumber` — the existing `FOR UPDATE` on the organization row.\n- `ClientMembership` — writers are accept (create/restore) and remove. `accountId @unique` is the\n  race backstop for two concurrent accepts; removal does the status write and the `securityStamp`\n  rotation in one transaction (REQ-03-006), which is the whole of the concurrency the spec asks\n  for. The repository takes no row lock on `Membership` today and this row is planned the same\n  way.\n- `RequestNotification` — no lock; `@@unique([eventId, recipientKind, recipientId])` is the\n  mechanism REQ-03-039 names.\n\n### Messages\n\nEvery row of the Error Messages table is placed in `handoff.messages`, with the module that\nexports it and the route that emits it. Five are new (`CLIENT_USER_MESSAGES.*`), three are new\nkeys on the existing `REQUEST_MESSAGES` (`clientProjectRequired`, `clientProjectMismatch`,\n`notOnProject`) — that const is extended in place, never duplicated. The remaining rows exist\nverbatim already and were grepped (`packages/validation/src/index.ts:1818-1890`, `:2219-2226`,\n`:217-232`, `:337-345`).\n\n### Verification plan\n\nEvery state a case needs is reached through this spec's own routes or through a helper that\nexists today; the \"Exists today\" column checks out against `e2e/tests/helpers.ts`. **This spec\nowes no test fixture** and adds nothing under `apps/api/src/test-support/`. The three rows marked\n`not run` are the ones this change creates.\n\n---\n\n## Things the implementer will hit that the spec does not spell out\n\nThese are planned, not raised as blockers — each is derivable from a rule the spec does state.\n\n1. **How a screen knows the client principal is the addressee.** `request-detail/page.tsx:86`\n   learns \"who am I\" from `GET …/members`, which answers a client principal 404 (REQ-03-019).\n   The answer follows from REQ-03-034 and REQ-03-029: every request a client principal can read\n   is one they are the addressee of, so `isAssignee` is true for any request that loads.\n   No new endpoint field, and none is invented.\n2. **Where sign-in lands.** `apps/web/app/login/LoginForm.tsx:92` and\n   `apps/web/app/accept-invite/AcceptInviteScreen.tsx:322` both hardcode\n   `/org/{orgId}/members`. TC-03-E2E-01 requires a contact to land on the requests screen. The\n   contracts amend `/api/me` and do **not** amend the login body, so the branch reads\n   `/api/me` — the pattern the accept screen already uses.\n3. **The requests list's two side reads.** `requests/page.tsx:224` (projects) and `:251`\n   (topics) will 404 for a client principal. Both already swallow a failure, so nothing breaks,\n   but they are gated on the principal kind so no refused call is made at all.\n4. **A decline writes two events.** `transition` records `message_posted` *and* `status_changed`\n   in one transaction. REQ-03-035 is written per event (\"in the same transaction as the\n   `RequestEvent`\") and REQ-03-039's uniqueness is per event, so the plan writes one row per\n   recipient per notifiable event, and a decline therefore produces two. Note N1.\n\n---\n\n## Notes handed to the human (not blocking)\n\n- **N1 — a decline notifies twice.** Reading REQ-03-035 per event (which is what its own words and\n  REQ-03-039's uniqueness key say) means a decline, which writes two events, produces two outbox\n  rows per recipient. No case asserts the count for a decline, so nothing catches it either way.\n- **N2 — TC-03-INT-24 and TC-03-INT-26 together fix the dispatch shape.** TC-03-INT-26 requires\n  the route to answer *before* the notifier double is released, so delivery cannot be awaited in\n  the request path; TC-03-INT-24 asserts the rows have reached `skipped`/`attempts: 1` after the\n  three calls. Both hold only if the case waits for the drain rather than reading immediately.\n  Planned as: dispatch scheduled after commit, not awaited, with the test polling.\n- **N3 — the client's post-auth landing is asserted but not required.** TC-03-E2E-01 observes it;\n  no REQ states it. Planned from the case.\n\n## Test levels\n\nThe 5 E2E cases each buy something an API test cannot reach: mail-to-accept-to-sign-in as a\njourney (E2E-01), a control that must not be drawn and a URL typed by hand (E2E-02), a session\nrevoked mid-visit across two browser contexts (E2E-03), focus and the per-audience re-read in a\nmodal (E2E-04), the drawn/undrawn action controls (E2E-05). Every server rule — status code,\nmessage, token state, authorization decision — sits at integration. Nothing is duplicated across\nlevels.\n","status":"pass","findings":[{"id":"P1","target":"spec","severity":"note","rule":null,"file":"specs/requests/03-client-participants.md","symbol":"REQ-03-035","claim":"A decline writes two RequestEvents in one transaction, so a per-event reading of REQ-03-035 produces two outbox rows per recipient for one decline, and no case asserts the count either way.","witness":{"kind":"scenario","detail":"apps/api/src/requests/requests.service.ts:534 records a `message_posted` event for the decline reason AND a `status_changed` event in the same transaction. REQ-03-035 says one RequestNotification row per recipient is written 'in the same transaction as the RequestEvent', and REQ-03-039's uniqueness key is ([eventId, recipientKind, recipientId]) — both are per event, so a decline notifies its recipient twice. TC-03-INT-21 exercises decline and asserts nothing about the outbox; TC-03-INT-24 asserts counts for create, message and answer only. The plan follows the spec's own words (one row per notifiable event, field_changed excluded), and either reading ships green."},"suggestedFix":"if one notification per decline is wanted rather than two, say so in REQ-03-035 and add a count assertion to TC-03-INT-21","_key":"null@specs/requests/03-client-participants.md#REQ-03-035","_carriedFrom":null},{"id":"P2","target":"spec","severity":"note","rule":null,"file":"specs/requests/03-client-participants.cases.md","symbol":"TC-03-INT-24","claim":"TC-03-INT-24 and TC-03-INT-26 together fix the dispatch shape: delivery cannot be awaited in the request path, so TC-03-INT-24 must wait for the drain rather than reading the rows the instant the route answers.","witness":{"kind":"scenario","detail":"TC-03-INT-26 requires 'the route answers before the double is released', which forbids awaiting deliver() before responding. TC-03-INT-24 then asserts every row reads status `skipped`, handledAt set and attempts at one after three calls. Read literally and immediately, the second assertion races the first requirement. Both hold if the case polls for the terminal state; the plan schedules dispatch after the commit without awaiting it and says so in T6 and T10."},"suggestedFix":"none required — recorded so the case author does not read the outbox synchronously and conclude the dispatcher is broken","_key":"null@specs/requests/03-client-participants.cases.md#TC-03-INT-24","_carriedFrom":null},{"id":"P3","target":"spec","severity":"note","rule":null,"file":"specs/requests/03-client-participants.cases.md","symbol":"TC-03-E2E-01","claim":"Where a client contact lands after signing in is asserted by a case but stated by no requirement, and the two screens that decide it hardcode a destination the contact is refused.","witness":{"kind":"scenario","detail":"apps/web/app/login/LoginForm.tsx:92 and ap pal is resolved from the database on every request inside the read `SessionGuard` already makes for the security stamp, so no cookie field changed and no cookie minted before this spec became invalid. `OrgScopeGuard` is the single choke point for REQ-03-019: a client principal gets the same bare 404 there that a stranger's organization gives, and the seven exempt handlers opt in explicitly, so a route added later is refused by default. Contacts invite/list/remove decide capability in the service (404, never a 403 naming it), removal rotates the security stamp in the status write's own transaction, and the client branch of invitation acceptance creates or restores exactly one row and writes no `Membership` — with the mirrored refusal at both ends of the staff invitation. Client-addressed requests keep the create route's existing answer order with the audience, addressee and project rules slotted where the spec puts them, and every actor guard is evaluated against the row re-read `FOR UPDATE`.\n\n**The port.** `RequestNotifier` is an abstract class used as its own DI token, its adapter chosen in a sibling provider and registered global — the shape `MailService` already uses. Outbox rows ride the transaction that wrote the event; dispatch happens after the commit and is never awaited.\n\n**Web.** One identity shape for both principals, the requests destination as a contact's only navigation entry, the contacts section on client detail, and the addressee-kind control plus contact picker in the new-request modal.\n\n## Three things worth your attention\n\n1. **The spec says \"DS gaps: None\" and it is now one short.** The extra field made the new-request modal taller than the viewport, and `Modal` had no max height and no scrolling body, so its actions row became unreachable. I fixed it in the design system rather than on the screen, and every modal-driven E2E suite still passes — but it belongs in that spec's DS gaps table, which I cannot edit.\n\n2. **A `user` who may address a contact cannot discover one.** The permission matrix grants `user` the right to raise a request to a client contact, but the only routes that list contacts need `view-clients`. The picker is a convenience and the server still decides, so nothing is wrongly refused — but there is no route by which that role fills it. I did not invent one.\n\n3. **Two existing assertions moved**, both where this spec explicitly supersedes spec 01's answer (its own edge case 19 names the refusal it replaces). Details, with the before/after, are in the stage report.","report":"# implement — attempt 2\n\nSpec: `specs/requests/03-client-participants.md` (+ `.contracts.md`, `.cases.md`)\nCommit: `771451a implement: client participants and client-addressed requests (requests/03)`\n\nAttempt 1 was interrupted mid-run; no commit was made then, so this attempt carries the\nwhole handoff in one commit. There are no findings from a prior stage to answer.\n\n## Tasks\n\n### T1 — schema and the one migration\n- `apps/api/prisma/schema.prisma` — `ClientMembership` and `RequestNotification`; the four\n  nullable columns (`Invitation.clientId`, `Request.assigneeClientMembershipId`,\n  `RequestMessage.authorClientMembershipId`, `RequestEvent.actorClientMembershipId`) and\n  their back-relations.\n- `apps/api/prisma/migrations/20260903130000_requests_03_client_participants/migration.sql`\n  — the only migration this run creates. Two new tables, four nullable columns, no rename,\n  no drop, no new NOT NULL, no backfill. `RequestNotification.recipientId` carries no FK,\n  so a row survives the principal it points at being removed.\n\n### T2 — packages/validation\n- `src/index.ts` — `CLIENT_USER_MESSAGES` (new export, five keys, text verbatim from the\n  Error Messages table); three new keys **on the existing** `REQUEST_MESSAGES`\n  (`clientProjectRequired`, `clientProjectMismatch`, `notOnProject`);\n  `validateClientContactEmail` (rule 1); `CLIENT_INVITATION_ROLE`, `INVITATION_ROLE_VALUES`\n  and `isClientInvitationRole` — `isValidRole` and `ROLE_VALUES` are untouched, so `client`\n  can never be assigned through the staff invite body.\n- `src/roles.ts` — `ClientCapability`, the flat `CLIENT_CAPABILITIES`, `Principal` and\n  `capabilitiesForPrincipal`. `Capability`, `ROLE_CAPABILITIES`, `MemberCapability` and\n  `CAPABILITY_MATRIX` gain nothing.\n- `src/requests.ts` — `REQUEST_ASSIGNEE_KINDS` widened to `['member','client']`;\n  `validateRequestAssignee` branches per kind and reports under the id that kind selects\n  (`requestAssigneeFieldFor`); `validateNewRequest` adds rule 8 (a client addressee names a\n  project) alongside the body shape.\n\n### T3 — the principal\n- `src/auth/principal.ts` (new) — `SessionPrincipal` and `resolvePrincipal`, REQ-03-002's\n  table: the staff row wins, an active client row alone resolves the client principal.\n- `src/auth/session.guard.ts` — the memberships ride the security-stamp read that already\n  happens; the principal is put on the request. No cookie field changed.\n- `src/auth/allow-client-principal.decorator.ts` (new) + `src/auth/org-scope.guard.ts` —\n  REQ-03-019 at the one choke point, opt-in so a route added later is refused by default.\n- `src/auth/login.service.ts` — the principal decision is made **before** the password\n  compare, exactly where the membership check already was.\n- `src/members/me.controller.ts` — one shape for both principals; the branch is taken on\n  the resolved principal, not on which rows exist.\n- `src/requests/requests.controller.ts` — `@AllowClientPrincipal()` on exactly seven\n  handlers: list, detail, answer, decline, messages, create and grant.\n\n### T4 — client contacts and the two-ended principal conflict\n- `src/clients/client-contacts.controller.ts`, `client-contacts.service.ts` (new) — the\n  three routes; `manage-clients` / `view-clients` decided in the service through\n  `ClientsService`'s own gates (made public, one edit to `clients.service.ts`), so a caller\n  lacking either gets the same bare 404 the client's detail route gives them. Invite writes\n  the `Invitation` with the client's id and role `client`, superseding every other pending\n  invitation for that address in the same transaction. Removal writes the status and\n  rotates `Account.securityStamp` in one transaction.\n- `src/invitations/invitations.service.ts` — `requireNoConflictingPrincipal` (REQ-03-014 and\n  REQ-03-042, one rule at both ends), the `client` accept branch (create or restore the same\n  row, no `Membership`), `redirectTo` per principal, and the staff invitation's own refusal\n  at write time.\n- `src/invitations/invitations.controller.ts` — the destination comes from the service.\n\n### T5 — client-addressed requests\n- `src/requests/requests.service.ts` — `ClientCaller` beside `Caller`; `requireCaller`\n  resolves either; `requireMemberCaller` for the routes REQ-03-019 does not open. Create\n  refuses a client principal first (REQ-03-027), then keeps the existing order: body,\n  topic, audience (all four cells), addressee (404 before inactive), project last\n  (mismatch, then not-on-project, no admin carve-out). `lockRequest` re-reads\n  `assigneeClientMembershipId` under `FOR UPDATE` and every actor guard is evaluated\n  against that read. List, party, answer, decline, message and grant per the spec.\n- `requests.serializer.ts` / `requests.dto.ts` — `toRequestAssignee` answers both kinds;\n  `clientName` added, the contact's email never carried.\n\n### T6 — the notification port\n- `request-notifier.ts`, `null-request-notifier.ts`, `request-notifier.provider.ts`,\n  `request-notifications.service.ts` (new); registered in `core.module.ts` / `app.module.ts`\n  the way `MailService` is. `record` writes in the caller's transaction; `dispatch` runs\n  after the commit and is not awaited; `field_changed` notifies nobody; the actor is never\n  a recipient; a reassignment notifies the incoming addressee.\n- `request-events.service.ts` returns the event id so the outbox rows can carry it.\n\n### T7/T8/T9 — the web half\n- `session-context.tsx` (`principal`, `client`, nullable `role`), `layout.tsx`,\n  `Sidebar.tsx` (requests is the only entry for a contact), `requests-badge-context.tsx`,\n  `LoginForm.tsx` and `AcceptInviteScreen.tsx` (both branch on `/api/me`; the login\n  response body is unchanged), the requests list and detail screens.\n- `ClientContactsSection.tsx` + `InviteContactModal.tsx` (new) on client detail.\n- `NewRequestModal.tsx` — `request-new-assignee-kind` (a labelled `Select`),\n  `request-new-assignee-client` (a `Select` whose option label is a `ReactNode`), the\n  per-audience catalogue and the project narrowing.\n\n### T10 — the cases\n| Level | File |\n|---|---|\n| Unit | `packages/validation/src/roles.test.ts` — TC-03-UNIT-01, TC-03-UNIT-02 |\n| Unit | `packages/validation/src/requests.test.ts` — the client addressee (rules 5, 8, 13) |\n| Integration | `apps/api/test/client-participants.spec.ts` — TC-03-INT-01…23, 31…35 |\n| Integration | `apps/api/test/request-notifications.spec.ts` — TC-03-INT-24…30 |\n| E2E | `e2e/tests/client-participants.spec.ts` — TC-03-E2E-01…05 |\n\n## Commands run\n\n| Command | Result |\n|---|---|\n| `npm run test:unit` (root) | `Test Files 23 passed (23)`, `Tests 1098 passed (1098)` |\n| `npx tsc --noEmit` in `apps/api` | clean |\n| `npx tsc --noEmit` in `apps/web` | clean |\n| `npm test -- test/client-participants.spec.ts test/request-notifications.spec.ts test/requests.spec.ts` (apps/api) | `Tests: 58 passed, 58 total` |\n| `npm test -- …16 suites the diff touches…` (apps/api) | `Test Suites: 16 passed`, `Tests: 1 skipped, 206 passed, 207 total` |\n| `E2E_WEB_PORT=3100 E2E_API_PORT=4100 CI=1 npx playwright test tests/client-participants.spec.ts` | `5 passed (33.8s)` |\n| `… tests/regressions.spec.ts tests/app-shell.spec.ts tests/requests.spec.ts` | `24 passed (1.1m)` |\n| `… tests/clients.spec.ts tests/invitation.spec.ts tests/requests-page.spec.ts tests/request-topics.spec.ts` | `18 passed (50.6s)` |\n\nThe 16 API suites were `client-participants`, `request-notifications`, `requests`,\n`requests-page`, `login`, `logout`, `invitations`, `clients`, `org-scope`,\n`session-revocation`, `members`, `capability`, `reset-password`, `signup`, `projects`,\n`request-topics`. `npm run lint` in `apps/web` is `next lint`, which in this checkout has no\nESLint config and drops into an interactive setup prompt; nothing was configured for it.\n\n## Things the reviewer should look at deliberately\n\n1. **A DS gap the spec says is none.** Adding the addressee-kind control made the\n   new-request modal taller than a 720px viewport, and `Modal` had no max height and no\n   scrolling body: the actions row went off-screen with nothing able to scroll it back\n   (Playwright: *element is outside of the viewport*). Fixed **in the design system** —\n   `1_DS for dev/components/surfaces/Modal.jsx` now caps the dialog at\n   `calc(100vh - 40px)` and scrolls its body, header and actions pinned — rather than\n   improvised on the screen. It belongs in this spec's DS gaps table, which I may not\n   edit; recorded here and in the verdict instead. Every existing modal-driven E2E suite\n   above passes with it.\n\n2. **Two existing assertions moved because this spec governs them now.**\n   - `packages/validation/src/requests.test.ts` TC-01-UNIT-03: `kind: 'client'` is no\n     longer refused *for being an unknown kind*, so the case now asserts it is refused for\n     carrying the wrong id, and a new spec-03 block asserts the accepted shape.\n   - `apps/api/test/requests.spec.ts` (spec 01's edge case 7): the same body now answers\n     `{assigneeClientMembershipId: assigneeInvalid, projectId: clientProjectRequired}`,\n     which is TC-03-INT-32's fourth case plus REQ-03-021. Edge case 19 of this spec names\n     that answer as the one it replaces. A refusal of an unknown kind (`vendor`) was added\n     beside it, so the case still covers what it covered.\n\n3. **Reassignment still takes a colleague only.** `REQUEST_ASSIGNEE_KINDS` widening means\n   `validateRequestAssignee` would accept `client` on the reassign body too;\n   `reassignRequest` refuses a non-`member` kind with the answer that route already gives,\n   because \"a reassign path that accepts a client addressee\" is in Known Gaps as not built.\n\n4. **The contact picker's source.** No route serves \"the addressable contacts of the\n   organization\"; the modal fills the picker from `GET …/clients?status=active` plus each\n   client's contacts. Both need `view-clients`, so for a `user` holding `create-request`\n   the picker comes back empty even though the permission matrix lets them address a\n   contact. The narrowing is a convenience and the server decides, so nothing is refused\n   incorrectly — but a `user` cannot discover a contact through the product today. Noted,\n   not invented around: no route the spec does not have was added.\n\n5. **The invited row's name hints.** The contracts accept optional `firstName`/`lastName`\n   \"shown in the contacts list until the invitation is accepted\", while the Data Model gives\n   `Invitation` exactly one new column (`clientId`) — there is nowhere to persist them. They\n   are validated, echoed back on the `201` row, and the list shows the account's own names\n   once there is an account, falling back to the address. No column was added for them.\n\n6. **A decline writes two outbox rows per recipient** (its `message_posted` and its\n   `status_changed`), which is REQ-03-035 read literally per event. No case asserts the\n   count; the pre-implement note N1 flagged it and it is implemented as written.\n\n7. **`GET /api/me` for a removed member of staff** still answers the body it answers today\n   (with `principal: \"member\"`), so nothing about the existing shell changed.\n","status":"pass","findings":[],"covered":null,"suites":null,"has":{"prompt":true,"log":true,"verdict":true,"report":true,"start":true},"tools" const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Round once, then split. Flooring the minutes off an unrounded value while rounding the
   seconds prints 0:60 for anything just under a minute — which only shows up once a caller
   passes a live, fractional number. */
const mmss = s => { const t = Math.round(s); return Math.floor(t/60) + ':' + String(t%60).padStart(2,'0'); };
const hhmm = ms => new Date(ms).toTimeString().slice(0,8);
const pctOf = (a,b) => b ? Math.round(a/b*100) : 0;
const nfmt = n => (n ?? 0).toLocaleString('ru-RU');
/* Cost and tokens live only in the closing summary the SDK sends. A stage killed by its fuse
   has none, and they cannot be recovered from the stream — its per-message usage is chunk
   deltas under different accounting. So the board says the figure is missing, never zero. */
const NO_SUMMARY = 'нет — убит до сводки';
const isBlocker = f => f.severity !== 'note' && f.severity !== 'info';
const stateChip = st => ({done:'', running:'<span class="chip c-run">идёт</span>', aborted:'<span class="chip c-block">убит</span>'}[st] ?? '');
const verdictChip = s => {
  const m = { pass:'c-pass', blocked:'c-block', fail:'c-block', error:'c-info', running:'c-run', aborted:'c-block' };
  return s ? '<span class="chip ' + (m[s]||'c-info') + '">' + esc(s) + '</span>' : '';
};

function render() {

/* ── header ─────────────────────────────────────────────────────────── */
const isRefine = D.kind === 'refine';
document.title = (isRefine ? 'Рефайн · ' : 'Прогон · ') + D.runId;
document.getElementById('hdTitle').textContent = D.spec || D.runId;
document.getElementById('hdStatus').innerHTML =
  verdictChip(D.status) + (D.totals.running ? ' <span class="chip c-run">' + (isRefine ? 'луп идёт' : 'прогон идёт') + '</span>' : '') +
  (D.halt ? ' <span class="chip c-block">' + (isRefine ? 'стоп' : 'halt') + ': ' + esc(D.halt.reason || '') + '</span>' : '');
document.getElementById('hdMeta').innerHTML =
  hhmm(D.t0) + ' → ' + hhmm(D.t1) +
  (D.branch ? ' · ветка <span class="mono">' + esc(D.branch) + '</span>' : '') +
  (D.diff ? ' · ' + esc(D.diff) : '') +
  (isRefine ? ' · ' + D.rounds.length + ' раунд(ов)' + (D.request ? ' · запрос: ' + esc(D.request) : '') : '') +
  (D.budget ? ' · бюджет: код ' + D.budget.codeAttempts + ', переплан ' + D.budget.handoffReplans + ', среда ' + D.budget.infra : '');

/* A refine loop has no diff and no review, so the two cards that are about those say nothing
   true about it; a run whose init died has no steps, so none of the four analyses has anything
   to analyse. Hidden rather than left empty: an empty card reads as a finding of zero — a
   coverage table saying 0 of 0 is indistinguishable from one saying nothing was reviewed. */
const bare = !D.steps.length;
document.getElementById('cardRouting').hidden = isRefine || bare;
document.getElementById('cardCov').hidden = isRefine || bare || !D.coverage;
document.getElementById('cardSplit').hidden = bare;
document.getElementById('cardStages').hidden = bare;
document.getElementById('cardRounds').hidden = !isRefine;

const T = D.totals;
document.getElementById('hdMetrics').innerHTML = [
  ['Время', mmss(T.wallSec), T.invocations + ' вызовов' + (T.aborted ? ' + ' + T.aborted + ' убит' : '') + (T.running ? ' + ' + T.running + ' идёт' : '')],
  ['Стоимость', '$' + T.costUsd, T.turns + ' ходов' + (T.estimated ? ' · ' + T.estimated + ' оценено' : '')
    + (T.unaccounted ? ' · без ' + T.unaccounted + ' убит.' : '')],
  /* Output alone is a thousandth of what the run actually moves: every turn re-reads the whole
     accumulated context, so a long stage is cache reads and almost nothing else. Showing only
     the output made a 131M-token run read as 79k. */
  ['Токенов', (T.outTokens/1000).toFixed(0) + 'k вых.',
    T.cacheTokens ? nfmt(Math.round(T.cacheTokens/1e6)) + 'M кэш' : (T.tokPerSec + ' ток/с')],
  ['Размышление', pctOf(T.apiSec, T.wallSec) + '%', mmss(T.apiSec) + ' в API'],
  ['Инструменты', pctOf(T.toolSec, T.wallSec) + '%', T.calls + ' вызовов'],
  ['Блокеры', String(T.blockers), T.notes + ' заметок'],
].map(([k,v,s]) => '<div class="metric"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="s">' + s + '</div></div>').join('');

/* ── gantt ──────────────────────────────────────────────────────────── */
(function(){
  const span = Math.max(1, D.t1 - D.t0);
  viewT0 = D.t0; viewSpan = span;
  const lanes = [...new Set(D.steps.map(s => s.stage))];
  const rows = lanes.map(lane => {
    const bars = D.steps.filter(s => s.stage === lane).map(s => {
      const l = (s.startedAt - D.t0) / span * 100;
      const w = Math.max(((s.endedAt ?? Date.now()) - s.startedAt) / span * 100, 0.4);
      if (s.script) return '<div class="ggate" style="left:' + l.toFixed(2) + '%" title="' + esc(s.stage + ' ' + s.attempt + ': ' + (s.status||'')) + '"></div>';
      const cls = s.state === 'aborted' ? ' abort' : s.state === 'running' ? ' running' : '';
      const bg = cls ? '' : ';background:' + (COLOR[s.stage] || '#79747E');
      const label = s.state === 'aborted' ? s.attempt + '✗' : s.attempt + ' · ' + mmss(s.wallSec) + (s.costUsd ? ' · $' + s.costUsd : '');
      const grows = s.state === 'running' ? ' data-start="' + s.startedAt + '" data-attempt="' + s.attempt + '"' : '';
      return '<div class="gbar' + cls + '" data-go="' + s.stage + '-' + s.attempt + '"' + grows + ' style="left:' + l.toFixed(2) + '%;width:' + w.toFixed(2) + '%' + bg + '" title="' + esc(s.stage + ' ' + s.attempt + ' · ' + (s.status||s.state)) + '">' + esc(label) + '</div>';
    }).join('');
    return '<div class="grow"><div class="glab">' + esc(lane) + '</div><div class="gtrack">' + bars + '</div></div>';
  }).join('');
  const ticks = Array.from({length:7}, (_,i) => '<div class="gtick" style="left:' + (i/6*100) + '%">' + hhmm(D.t0 + span*i/6) + '</div>').join('');
  document.getElementById('gantt').innerHTML = rows + '<div class="gaxis">' + ticks + '</div>';
})();

/* ── rail ───────────────────────────────────────────────────────────── */
document.getElementById('rail').innerHTML = D.steps.map((s,i) => {
  const bad = s.findings.some(isBlocker) || s.state === 'aborted';
  const dot = s.script ? '#79747E' : (COLOR[s.stage] || '#79747E');
  const last = s.tools && s.tools.length ? s.tools[s.tools.length - 1] : null;
  /* On a step that is going, what it is doing beats what model it is: the model does not
     change and the tool is the only thing on this line that ever moves. */
  const under = s.state === 'running' && last
    ? '<small class="live">' + esc(last.actor && last.actor !== s.agent ? last.actor + ' · ' + last.tool : last.tool) + '</small>'
    : '<small>' + esc(s.model || (s.script ? 'скрипт' : '')) + '</small>';
  return (i ? '<div class="connector"></div>' : '') +
    '<button class="stepitem" data-idx="' + i + '">' +
      '<span class="dot' + (s.state === 'running' ? ' beat' : '') + '" style="background:' + dot + '">' + (s.script ? '·' : s.attempt) + '</span>' +
      '<span class="nm">' + esc(s.stage) + under + '</span>' +
      '<span class="tm">' + (s.script ? '—' : mmss(s.wallSec)) + (bad ? ' ●' : '') + '</span>' +
    '</button>';
}).join('');

/* ── steps ──────────────────────────────────────────────────────────── */
function findingHtml(f) {
  const sev = isBlocker(f) ? 'blocker' : 'note';
  const w = f.witness;
  const deep = [
    w && w.detail ? '<div class="blk"><b>Свидетельство' + (w.kind ? ' · ' + esc(w.kind) : '') + '</b>' + esc(w.detail) + (w.source ? '<br><span class="mono dim">' + esc(w.source) + '</span>' : '') + '</div>' : '',
    f.suggestedFix ? '<div class="blk"><b>Предложенная починка</b>' + esc(f.suggestedFix) + '</div>' : '',
  ].join('');
  return '<div class="find ' + sev + '">' +
    '<div class="fh">' +
      '<span class="chip ' + (sev === 'blocker' ? 'c-block' : 'c-note') + '">' + esc(f.severity) + '</span>' +
      '<span class="chip c-' + esc(f.target) + '">→ ' + esc(f.target) + '</span>' +
      '<b>' + esc(f.id) + '</b>' +
      (f._carriedFrom ? '<span class="chip out">повтор из ' + esc(f._carriedFrom) + '</span>' : '') +
      '<span class="mono dim">' + esc(f.file || '') + (f.symbol ? '#' + esc(f.symbol) : '') + (f.line ? ':' + f.line : '') + '</span>' +
    '</div>' +
    '<div class="rule">' + esc(f.rule) + '</div>' +
    '<div class="claim">' + esc(f.claim) + '</div>' +
    (deep ? '<details><summary>Свидетельство и починка</summary><div class="deep">' + deep + '</div></details>' : '') +
  '</div>';
}

/* The last thing the agent actually did. On a running step it is the answer to "is it alive",
   so it carries a live clock; on a finished one the wall time it happened at is more use than
   a distance from now. The actor is named only when it is not the agent the orchestrator
   started — that is a sub-agent, and whose work it is matters more than the tool. */
function actHtml(s) {
  const t = s.tools && s.tools.length ? s.tools[s.tools.length - 1] : null;
  if (!t) return '';
  const live = s.state === 'running';
  const who = t.actor && t.actor !== s.agent ? '<b>' + esc(t.actor) + '</b> · ' : '';
  const when = live ? '' : hhmm(t.ts || (s.startedAt + t.at * 1000));
  return '<span class="act' + (live ? ' live' : '') + '"' + (t.ts ? ' data-ts="' + t.ts + '"' : '') + '>' +
    '<span class="ico">' + (live ? '▸' : '↳') + '</span>' +
    '<span class="who">' + who + esc(t.tool) + '</span>' +
    (t.what ? '<span class="what">' + esc(t.what.slice(0, 160)) + '</span>' : '') +
    '<span class="ago">' + when + '</span></span>';
}

function routeHtml(s) {
  const bits = [];
  if (s.routedHere) bits.push('<div><span class="arrow">← пришло сюда:</span> ' + esc(s.routedHere.why) + '</div>');
  if (s.routing) {
    const prio = D.priority.map(t => '<i class="' + (t === s.routing.winner ? 'win' : '') + '">' + t + '</i>').join('');
    bits.push('<div style="margin-top:8px"><span class="arrow">Победил адрес:</span> <b>' + esc(s.routing.winner) + '</b>' +
      '<span class="prio">' + prio + '</span></div>' +
      (s.routing.why ? '<div style="margin-top:4px">' + esc(s.routing.why) + '</div>' : '') +
      '<div style="margin-top:4px">Причина маршрута: <b>' + s.routing.cause.join(', ') + '</b>' +
      (s.routing.alongside.length
        ? '. Поехали следом, не будучи причиной: ' + s.routing.alongside.map(a => a.id + ' (' + a.target + ')').join(', ')
        : '') + '</div>');
  }
  if (s.routedAway) bits.push('<div style="margin-top:8px"><span class="arrow">→ ушло в ' + esc(s.routedAway.to || s.routedAway.kind) + ':</span> ' + esc(s.routedAway.why) + '</div>');
  return bits.length ? '<div class="route">' + bits.join('') + '</div>' : '';
}

function paneReceived(s) {
  const meta = '<dl class="kv">' +
    '<dt>Агент</dt><dd>' + esc(s.agent || 'скрипт') + '</dd>' +
    '<dt>Модель</dt><dd>' + esc(s.model || '—') + '</dd>' +
    (s.resumedSession ? '<dt>Продолжает сессию</dt><dd>' + esc(s.resumedSession) + '</dd>' : '') +
    (s.sessionId ? '<dt>Своя сессия</dt><dd>' + esc(s.sessionId) + '</dd>' : '') +
    (s.fuseMin ? '<dt>Предохранитель</dt><dd>' + s.fuseMin + ' мин</dd>' : '') +
    (s.headAtStart ? '<dt>HEAD на старте</dt><dd>' + esc(s.headAtStart.slice(0,10)) + '</dd>' : '') +
  '</dl>';
  const prompt = s.prompt
    ? '<h4 style="margin:16px 0 8px;font-size:13px">Промпт, который получил агент</h4><pre class="txt">' + esc(s.prompt) + '</pre>'
    : (s.script
      ? '<div class="note-callout">Скрипт-гейт: ни промпта, ни модели. Только вердикт.</div>'
      : '<div class="note-callout">Промпт не записан: этот прогон старше, чем захват входных данных. Оба оркестратора — <span class="mono">ship.mjs</span> и <span class="mono">refine-loop.mjs</span> — пишут промпт до того, как дёрнут агента, так что у новых прогонов здесь будет ровно то, что он получил.</div>');
  return routeHtml(s) + meta + prompt;
}

function paneDid(s) {
  const commits = s.commits && s.commits.length
    ? '<h4 style="margin:0 0 8px;font-size:13px">Коммиты в окне этого шага</h4><table><tr><th>SHA</th><th>Сообщение</th><th>Объём</th></tr>' +
      s.commits.map(c => '<tr><td class="mono">' + esc(c.sha) + '</td><td>' + esc(c.subject) + '</td><td class="dim">' + esc(c.stat) + '</td></tr>').join('') +
      '</table>'
    : '';
  const result = s.result
    ? '<h4 style="margin:16px 0 8px;font-size:13px">Заключительное сообщение агента</h4><div class="md">' + esc(s.result) + '</div>'
    : '<div class="empty">Заключительного сообщения нет' + (s.state === 'running' ? ' — шаг ещё идёт.' : s.state === 'aborted' ? ' — процесс был убит.' : '.') + '</div>';
  const report = s.report
    ? '<details style="margin-top:14px"><summary style="cursor:pointer;color:var(--primary);font-weight:500">Отчёт стадии целиком (' + s.report.length.toLocaleString('ru-RU') + ' символов)</summary><div class="md" style="margin-top:10px">' + esc(s.report) + '</div></details>'
    : '';
  return commits + result + report;
}

function paneVerdict(s) {
  if (!s.findings.length && !s.status) return '<div class="empty">Вердикта нет.</div>';
  const suites = s.suites ? '<h4 style="margin:14px 0 8px;font-size:13px">Прогоны тестов</h4><table><tr><th>Уровень</th><th>Результат</th><th>Комментарий</th></tr>' +
    ['unit','int','e2e'].map(k => {
      const x = s.suites[k]; if (!x) return '';
      const res = x.skipped ? '<span class="chip c-info">пропущен</span>'
        : (x.passed ?? 0) + ' ✓' + (x.failed ? ' / ' + x.failed + ' ✗' : '') + (x.ms ? ' · ' + (typeof x.ms === 'number' ? (x.ms/1000).toFixed(1) + ' с' : esc(x.ms)) : '');
      return '<tr><td><b>' + k + '</b></td><td>' + res + '</td><td class="dim" style="font-size:12px">' + esc(x.reason || x.note || (x.files||[]).join(', ')) + '</td></tr>';
    }).join('') + '</table>' : '';
  const cov = s.covered ? '<div class="note-callout"><b>Заявленное покрытие:</b> ' +
      (s.covered.files != null ? s.covered.files + ' из ' + (s.covered.of ?? '?') + ' файлов. ' : '') +
      esc(s.covered.note || '') +
      (s.coverageNamed != null ? '<br><b>Измеренное по журналу:</b> ' + s.coverageNamed + ' из ' + D.coverage.files + '.' : '') +
    '</div>' : (s.coverageNamed != null ? '<div class="note-callout"><b>Измеренное покрытие:</b> ' + s.coverageNamed + ' из ' + D.coverage.files + ' файлов дифа.</div>' : '');
  const bl = s.findings.filter(isBlocker), nt = s.findings.filter(f => !isBlocker(f));
  return routeHtml(s) + cov +
    (bl.length ? '<h4 style="margin:0 0 10px;font-size:13px">Блокеры — ' + bl.length + '</h4>' + bl.map(findingHtml).join('') : '') +
    (nt.length ? '<h4 style="margin:18px 0 10px;font-size:13px">Заметки — ' + nt.length + ' <span class="dim" style="font-weight:400">(не возвращают работу, копятся для человека)</span></h4>' + nt.map(findingHtml).join('') : '') +
    (!bl.length && !nt.length ? '<div class="empty">Находок нет — чистый ' + esc(s.status || '') + '.</div>' : '') + suites;
}

function paneTools(s) {
  if (!s.tools.length) return '<div class="empty">Вызовов инструментов в журнале нет.</div>';
  const mix = Object.entries(s.byTool).sort((a,b) => b[1]-a[1])
    .map(([t,n]) => '<span class="chip out">' + esc(t) + ' · ' + n + '</span>').join(' ');
  const rows = s.tools.map(t =>
    '<tr><td class="n">+' + t.at + 'с</td><td>' + esc(t.tool) + '</td><td class="n">' + (t.sec >= 1 ? t.sec + ' с' : '') + '</td>' +
    '<td class="mono" style="word-break:break-all">' + esc(t.what) + '</td></tr>').join('');
  return '<div style="margin-bottom:12px;display:flex;gap:6px;flex-wrap:wrap">' + mix + '</div>' +
    '<table><tr><th class="n">Смещение</th><th>Инструмент</th><th class="n">Длит.</th><th>Что</th></tr>' + rows + '</table>';
}

function paneMetrics(s) {
  const bar = '<div class="sr"><span>время шага</span><div class="sbar">' +
    '<i class="i-think" style="width:' + s.thinkPct + '%"></i><i class="i-tools" style="width:' + (100-s.thinkPct) + '%"></i>' +
    '</div><span class="n2">' + s.thinkPct + '% / ' + (100-s.thinkPct) + '%</span></div>';
  return bar + '<dl class="kv" style="margin-top:14px">' + [
    ['Состояние', s.state + (s.stopReason ? ' · ' + s.stopReason : '')],
    ['Wall', mmss(s.wallSec)],
    ['В API (размышление и генерация)', s.apiSec ? mmss(s.apiSec) : '—'],
    ['В инструментах', s.toolSec + ' с в ' + s.calls + ' вызовах'],
    ['Ходов', s.turns ?? '—'],
    ['Выходных токенов', s.tokens
      ? nfmt(s.tokens.out) + (s.tokensRecovered ? ' · из транскрипта сессии' : (s.tokPerSec ? ' · ' + s.tokPerSec + ' ток/с' : ''))
      : NO_SUMMARY],
    ['Кэш прочитан / записан', s.tokens ? nfmt(s.tokens.cacheRead) + ' / ' + nfmt(s.tokens.cacheWrite) : NO_SUMMARY],
    ['Стоимость', s.costUsd == null ? NO_SUMMARY
      : s.costEstimated
        ? '≈$' + s.costUsd + ' — оценка по ставкам этого прогона' + (s.costErrPct ? ', ±' + s.costErrPct + '%' : '')
        : '$' + s.costUsd],
    ['Артефакты', Object.entries(s.has).filter(([,v]) => v).map(([k]) => k).join(', ') || 'нет'],
  ].map(([k,v]) => '<dt>' + k + '</dt><dd>' + esc(v) + '</dd>').join('') + '</dl>';
}

const TABS = [
  ['Получил', paneReceived, s => s.prompt ? 1 : 0],
  ['Сделал', paneDid, s => (s.commits||[]).length],
  ['Вердикт', paneVerdict, s => s.findings.length],
  ['Инструменты', paneTools, s => s.calls],
  ['Метрики', paneMetrics, () => 0],
];

document.getElementById('steps').innerHTML = (bare
  ? '<div class="card"><div class="body"><p class="dim" style="margin:0">Ни одного шага. ' +
    (D.status === 'half-created'
      ? 'Оркестратор не дописал <span class="mono">run.json</span> — прогон умер на инициализации, и всё, что от него осталось, это имя директории.'
      : 'Прогон ещё ничего не запустил.') + '</p></div></div>'
  : '') + D.steps.map((s,i) => {
  const bl = s.findings.filter(isBlocker).length, nt = s.findings.length - bl;
  const color = COLOR[s.stage] || '#79747E';
  const sub = [
    s.model || (s.script ? 'скрипт-гейт' : ''),
    s.script ? null : mmss(s.wallSec) + ' (' + s.thinkPct + '% размышление)',
    /* A killed stage has no cost, not a cost of nothing. Saying so beside the turns it did
       run is what keeps the most expensive attempt of a run from reading as the cheapest. */
    s.script ? null
      : s.costUsd == null ? 'стоимость неизвестна'
        : (s.costEstimated ? '≈$' + s.costUsd + ' (оценка)' : '$' + s.costUsd),
    s.turns ? s.turns + ' ходов' : null,
    s.calls ? s.calls + ' вызовов инстр.' : null,
    s.resumedSession ? '↻ продолжает сессию' : null,
  ].filter(Boolean).join(' · ');
  const tabs = TABS.map(([name,,count], ti) => {
    const c = count(s);
    return '<button class="tab' + (ti===0?' on':'') + '" data-s="' + i + '" data-t="' + ti + '">' + name +
      (c ? '<span class="badge">' + c + '</span>' : '') + '</button>';
  }).join('');
  const panes = TABS.map(([,fn], ti) => '<div class="pane' + (ti===0?' on':'') + '" data-s="' + i + '" data-t="' + ti + '">' + (s.script && ti < 4 ? '<div class="empty">Скрипт-гейт: ни промпта, ни модели. Только вердикт.</div>' + (ti===2 ? paneVerdict(s) : '') : fn(s)) + '</div>').join('');
  return '<div class="card step" id="' + s.stage + '-' + s.attempt + '" data-idx="' + i + '"' +
    (bl ? ' data-bad="1"' : '') + (s.state !== 'done' ? ' data-odd="1"' : '') + '>' +
    '<button class="step-head"><span class="idx" style="background:' + color + '">' + (s.script ? '·' : s.attempt) + '</span>' +
      '<span class="hd"><span class="ttl">' + esc(s.label || (s.stage + ' ' + s.attempt)) + ' ' + verdictChip(s.status) + ' ' + stateChip(s.state) +
        (bl ? '<span class="chip c-block">' + bl + ' блок.</span>' : '') +
        (nt ? '<span class="chip c-note">' + nt + ' зам.</span>' : '') +
      '</span><span class="sub">' + esc(sub) + '</span>' + actHtml(s) + '</span>' +
      '<span class="caret">▾</span></button>' +
    '<div class="panel"><div class="tabs">' + tabs + '</div>' + panes + '</div></div>';
}).join('');

/* ── interaction ────────────────────────────────────────────────────── */
stepEls = [...document.querySelectorAll('.step')];
function openStep(i, scroll) {
  const el = stepEls[i]; if (!el) return;
  el.classList.add('open'); openIds.add(el.id);
  document.querySelectorAll('.stepitem').forEach(b => b.classList.toggle('on', +b.dataset.idx === i));
  if (scroll) el.scrollIntoView({ block:'start' });
}

/* Put back what the reader had before this render replaced the markup. A step is remembered
   by its id rather than by its index: an attempt that starts while the page is open shifts
   every index after it, and restoring by position would reopen the wrong steps. */
stepEls.forEach(el => {
  if (allOpen || openIds.has(el.id)) el.classList.add('open');
  const t = activeTab.get(el.id);
  if (t != null) {
    el.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === t));
    el.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.dataset.t === t));
  }
});

if (!bound) {
document.addEventListener('click', e => {
  const head = e.target.closest('.step-head');
  if (head) { const el = head.closest('.step'); el.classList.toggle('open');
    if (el.classList.contains('open')) { openIds.add(el.id); openStep(+el.dataset.idx, false); }
    else openIds.delete(el.id);
    return; }
  const tab = e.target.closest('.tab');
  if (tab) {
    const { s, t } = tab.dataset;
    const step = tab.closest('.step');
    if (step) activeTab.set(step.id, t);
    document.querySelectorAll('.tab[data-s="' + s + '"]').forEach(b => b.classList.toggle('on', b.dataset.t === t));
    document.querySelectorAll('.pane[data-s="' + s + '"]').forEach(p => p.classList.toggle('on', p.dataset.t === t));
    return;
  }
  const item = e.target.closest('.stepitem');
  if (item) { openStep(+item.dataset.idx, true); return; }
  const bar = e.target.closest('[data-go]');
  if (bar) { const el = document.getElementById(bar.dataset.go); if (el) { el.classList.add('open'); openStep(+el.dataset.idx, true); } }
});
}

const FILTERS = [
  ['все', () => true],
  ['с блокерами', el => el.dataset.bad === '1'],
  ['незавершённые', el => el.dataset.odd === '1'],
];
document.getElementById('filters').innerHTML = FILTERS.map(([n],i) =>
  '<button class="fbtn' + (i===activeFilter?' on':'') + '" data-f="' + i + '">' + n + '</button>').join('') +
  '<span class="dim" style="margin-left:auto;font-size:12px">клик по полосе на диаграмме открывает шаг · j / k — следующий и предыдущий</span>';
const keepNow = FILTERS[activeFilter][1];
stepEls.forEach(el => { el.style.display = keepNow(el) ? '' : 'none'; });

if (!bound) {
document.getElementById('filters').addEventListener('click', e => {
  const b = e.target.closest('.fbtn'); if (!b) return;
  activeFilter = +b.dataset.f;
  document.querySelectorAll('.fbtn').forEach(x => x.classList.toggle('on', x === b));
  const keep = FILTERS[activeFilter][1];
  stepEls.forEach(el => { el.style.display = keep(el) ? '' : 'none'; });
});

document.getElementById('toggleAll').addEventListener('click', e => {
  allOpen = !allOpen;
  stepEls.forEach(el => { el.classList.toggle('open', allOpen); if (allOpen) openIds.add(el.id); else openIds.delete(el.id); });
  e.target.textContent = allOpen ? 'Свернуть всё' : 'Развернуть всё';
});

document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea')) return;
  if (e.key === 'j' || e.key === 'k') {
    cursor = Math.max(0, Math.min(stepEls.length - 1, cursor + (e.key === 'j' ? 1 : -1)));
    stepEls[cursor].classList.add('open'); openStep(cursor, true);
  }
});
}

/* ── routing log ────────────────────────────────────────────────────── */
document.getElementById('routing').innerHTML =
  '<p class="dim" style="margin-top:0">Порядок приоритета адресов — <span class="mono">' + D.priority.join(' → ') + '</span>. ' +
  'Один вердикт может нести блокеры с разными адресами, но маршрут берётся один: побеждает самый приоритетный из присутствующих, ' +
  'остальные едут следом. Текст в колонке «почему» написан самим роутером в момент решения.</p>' +
  '<table><tr><th class="n">Время</th><th>Откуда</th><th>Куда</th><th>Почему</th></tr>' +
  D.decisions.map(d => '<tr><td class="n">' + hhmm(d.at) + '</td><td>' + esc(d.from) + '</td>' +
    '<td>' + (d.to ? esc(d.to) : '<b>' + esc(d.kind) + '</b>') + '</td><td>' + esc(d.why) + '</td></tr>').join('') +
  '</table>';

/* ── think/tools split ──────────────────────────────────────────────── */
document.getElementById('split').innerHTML =
  '<p class="dim" style="margin-top:0">Время в API почти линейно по выходным токенам — ' + D.totals.tokPerSec +
  ' ток/с в среднем. Длительность ≈ токены ÷ ' + D.totals.tokPerSec + ' + инструменты (' + mmss(D.totals.apiSec) +
  ' + ' + mmss(D.totals.toolSec) + ' + ' + D.totals.orchestrationSec + ' с оркестрации = ' + mmss(D.totals.wallSec) + ').</p>' +
  D.steps.filter(s => !s.script && s.wallSec).map(s =>
    '<div class="sr"><span>' + esc(s.stage) + ' ' + s.attempt + '</span><div class="sbar">' +
    '<i class="i-think" style="width:' + s.thinkPct + '%"></i><i class="i-tools" style="width:' + (100-s.thinkPct) + '%"></i>' +
    '</div><span class="n2">' + s.toolSec + ' с инстр.</span></div>').join('');

/* ── stages ─────────────────────────────────────────────────────────── */
document.getElementById('stages').innerHTML =
  '<table><tr><th>Стадия</th><th>Модель</th><th class="n">Вызовов</th><th class="n">Wall</th><th class="n">Ходов</th>' +
  '<th class="n">Токенов</th><th class="n">% ток.</th><th class="n">$</th><th class="n">% денег</th><th class="n">Размышл.</th></tr>' +
  D.byStage.map(b => '<tr><td>' + esc(b.stage) + '</td><td class="mono">' + esc(b.model||'') + '</td>' +
    '<td class="n">' + b.invocations + '</td><td class="n">' + mmss(b.wallSec) + '</td><td class="n">' + b.turns + '</td>' +
    '<td class="n">' + nfmt(b.outTokens) + '</td><td class="n">' + pctOf(b.outTokens, D.totals.outTokens) + '%</td>' +
    '<td class="n">' + b.costUsd.toFixed(2) + '</td><td class="n">' + pctOf(b.costUsd*100, D.totals.costUsd*100) + '%</td>' +
    '<td class="n">' + pctOf(b.wallSec-b.toolSec, b.wallSec) + '%</td></tr>').join('') + '</table>';

/* ── rounds, on a refine loop ───────────────────────────────────────── */
if (isRefine) document.getElementById('rounds').innerHTML =
  '<p class="dim" style="margin-top:0">Каждый раунд — ворота по возрастанию цены: T0 бесплатен, ' +
  'T1 — те же ворота, на которых останавливается ship, T2 — судья. Раунд заканчивается коммитом, ' +
  'и следующий судит этот коммит, а не документ заново.</p>' +
  '<table><tr><th class="n">Раунд</th><th class="n">T0</th><th>T1 план</th><th>T2 судья</th><th>Починка</th><th>Коммит</th></tr>' +
  D.rounds.map(r => '<tr><td class="n">' + r.round + '</td>' +
    '<td class="n">' + (r.lint == null ? '—' : r.lint === 0 ? 'чисто' : r.lint) + '</td>' +
    '<td>' + (r.plan ? esc(r.plan.status) + (r.plan.specBlockers ? ' · ' + r.plan.specBlockers + ' в спеку' : '') : '—') + '</td>' +
    '<td>' + (r.judge ? r.judge.blockers + ' блок. / ' + r.judge.notes + ' зам. · ' + esc(r.judge.mode || '') : '—') + '</td>' +
    '<td>' + (r.fix ? 'починено ' + r.fix.fixed + ', решено ' + r.fix.decided + ', человеку ' + r.fix.left : '—') + '</td>' +
    '<td class="mono">' + (r.commit ? esc(r.commit) : '—') + '</td></tr>').join('') +
  '</table>';

/* ── coverage ───────────────────────────────────────────────────────── */
if (D.coverage) document.getElementById('cov').innerHTML =
  D.coverage.perPass.map(p => '<div class="sr"><span>review ' + p.attempt + '</span>' +
    '<div class="sbar"><i class="i-tools" style="width:' + pctOf(p.named, D.coverage.files) + '%"></i></div>' +
    '<span class="n2">' + p.named + ' / ' + D.coverage.files + '</span></div>').join('') +
  '<p style="margin-top:14px">Ни одним проходом не названы: <b>' + D.coverage.never.length + '</b> из ' + D.coverage.files + '.</p>' +
  (D.coverage.never.length ? '<table><tr><th class="n">Строк</th><th>Файл</th></tr>' +
    D.coverage.never.map(f => '<tr><td class="n">' + f.lines + '</td><td class="mono">' + esc(f.path) + '</td></tr>').join('') + '</table>' : '') +
  '<p class="dim" style="font-size:12px">Файл считается названным, когда его путь встретился в собственном вызове инструмента ревью. ' +
  'Пути нормализуются: <span class="mono">Read</span> на Windows отдаёт абсолютный путь с обратными слэшами, и без нормализации ' +
  'реестр не засчитывает ни одного чтения.</p>';

bound = true;
if (first) { first = false; if (D.steps.length) openStep(0, false); }
/* Fill the live clocks now rather than leaving them blank until the first tick, a second
   later — the gap is small and it is the first thing the eye lands on. */
tick();
}

/* ── the second hand ────────────────────────────────────────────────────
   Between two pushes nothing arrives, and an agent can think for minutes without touching a
   tool. Redrawing the page on a timer would be a lie about new data; not moving at all is a
   lie about being stuck. So the clock — and only the clock — advances locally: the running
   bar grows, its own elapsed time counts, and the silence is named. Everything that is a
   fact about the run still arrives from the run. */
function tick() {
  const now = Date.now();
  const span = Math.max(viewSpan, now - viewT0);

  document.querySelectorAll('.gbar.running[data-start]').forEach(el => {
    const startedAt = +el.dataset.start;
    const sec = (now - startedAt) / 1000;
    el.style.width = Math.min(100 - (startedAt - viewT0) / span * 100, Math.max((now - startedAt) / span * 100, 0.4)).toFixed(2) + '%';
    el.textContent = el.dataset.attempt + ' · ' + mmss(sec);
  });

  document.querySelectorAll('.act.live[data-ts]').forEach(el => {
    const ms = now - +el.dataset.ts;
    const ago = el.querySelector('.ago');
    if (ago) ago.textContent = ms < 2000 ? 'только что' : ms < 60000 ? Math.round(ms / 1000) + ' с назад' : mmss(ms / 1000) + ' назад';
  });

  const wall = document.querySelector('#hdMetrics .metric .v');
  if (wall && D.totals.running) wall.textContent = mmss(D.totals.wallSec + (now - D.generatedAt) / 1000);

  return now;
}

render();

/* ── the three views ────────────────────────────────────────────────────
   Specs, then what has been run against one, then one run. The deepest view is the report
   this page has always been; the two above it exist because a flat list of run ids answers
   "which run is 14-44-29" and never "where is spec 02", which is the question people arrive
   with. Only the run view survives on a file:// snapshot — the other two are a live index. */
let IDX = null;
let view = 'run';
let openSpec = null;

const VIEWS = { index: 'viewIndex', spec: 'viewSpec', run: 'viewRun' };
const specOf = (p) => (IDX ? IDX.specs.find((s) => s.path === p) ?? null : null);
const entryOf = (id) => {
  if (!IDX) return null;
  for (const s of [...IDX.specs, { entries: IDX.orphans }]) {
    const e = s.entries.find((x) => x.id === id);
    if (e) return e;
  }
  return null;
};

function show(v) {
  view = v;
  for (const [k, id] of Object.entries(VIEWS)) document.getElementById(id).hidden = k !== v;
  document.getElementById('fab').hidden = v !== 'run';
  document.getElementById('crumbs').hidden = !IDX;
  document.getElementById('hdMetrics').hidden = v !== 'run';
}

function crumbs() {
  const el = document.getElementById('crumbs');
  if (!IDX) { el.hidden = true; return; }
  /* Taken from the payload on screen rather than from what was clicked to get here: a run
     opened from a link, or one whose payload arrived after the view switched, would otherwise
     be filed under whichever spec the reader happened to pass through. */
  if (view === 'run') {
    const e = entryOf(D.runId);
    if (e) openSpec = e.spec ?? null;
  }
  const bits = ['<a data-go="#">Спеки</a>'];
  if (view !== 'index') {
    const s = specOf(openSpec);
    if (s) bits.push('<i>›</i><a data-go="#spec:' + esc(s.path) + '">' + esc(s.key) + '</a>');
    if (view === 'run') bits.push('<i>›</i><span>' + esc(D.runId) + '</span>');
  }
  el.innerHTML = bits.join('');
}

const wallOf = (sec) => (sec >= 3600 ? Math.round(sec / 360) / 10 + ' ч' : Math.round(sec / 60) + ' мин');

function renderIndex() {
  document.title = 'Спеки · борд';
  document.getElementById('hdTitle').textContent = 'Спеки';
  document.getElementById('hdStatus').innerHTML =
    IDX.specs.some((s) => s.running) ? '<span class="chip c-run">что-то идёт</span>' : '';
  const touched = IDX.specs.filter((s) => s.entries.length);
  const untouched = IDX.specs.filter((s) => !s.entries.length);
  document.getElementById('hdMeta').innerHTML =
    touched.length + ' из ' + IDX.specs.length + ' спек что-то запускали · $' +
    touched.reduce((a, s) => a + s.totals.costUsd, 0).toFixed(2) + ' всего';

  const row = (s) => '<button class="specrow" data-go="#spec:' + esc(s.path) + '">' +
    '<span class="specdot' + (s.running ? ' on' : '') + '"></span>' +
    '<span class="lead"><span class="nm">' + esc(s.key) + ' · ' + esc(s.title || s.path) + '</span>' +
    '<span class="sub">' + (s.entries.length
      ? s.entries.slice(0, 3).map((x) => esc(x.kind === 'refine' ? 'refine' : 'ship') + ' ' + esc(x.detail || x.status)).join(' · ')
        + (s.entries.length > 3 ? ' · +' + (s.entries.length - 3) : '')
      : 'ничего не запускалось') +
    (s.dependsOn.length ? ' · зависит от ' + esc(s.dependsOn.join(', ')) : '') + '</span></span>' +
    (s.entries.length
      /* Cost sums; wall clock does not. A run abandoned in August and stamped again in
         September spans a fortnight of nobody working, and four of those add up to a number
         that reads as effort and is calendar. */
      ? '<span class="num"><b>$' + s.totals.costUsd.toFixed(2) + '</b>' + s.entries.length + ' прогон(ов)</span>'
      : '') + '</button>';

  document.getElementById('specList').innerHTML =
    (touched.length ? '<div class="grouphd">Работа велась</div>' + touched.map(row).join('') : '') +
    (untouched.length ? '<div class="grouphd">Пока не запускалось</div>' + untouched.map(row).join('') : '') +
    (IDX.orphans.length
      ? '<div class="grouphd">Прогоны без спеки — она переименована или удалена</div>' +
        IDX.orphans.map((e) => '<button class="specrow" data-go="#' + esc(e.id) + '">' +
          '<span class="specdot"></span><span class="lead"><span class="nm">' + esc(e.id) + '</span>' +
          '<span class="sub">' + esc(e.status) + '</span></span></button>').join('')
      : '');
}

function renderSpec(path) {
  const s = specOf(path);
  if (!s) { location.hash = ''; return; }
  document.title = s.key + ' · борд';
  document.getElementById('hdTitle').textContent = s.key + ' · ' + (s.title || '');
  document.getElementById('hdStatus').innerHTML = s.running ? '<span class="chip c-run">идёт</span>' : '';
  document.getElementById('hdMeta').innerHTML =
    '<span class="mono">' + esc(s.path) + '</span>' +
    (s.dependsOn.length ? ' · зависит от <b>' + esc(s.dependsOn.join(', ')) + '</b>' : '') +
    ' · ' + s.totals.ship + ' ship, ' + s.totals.refine + ' refine · $' + s.totals.costUsd.toFixed(2) +
    (s.totals.blockers ? ' · <b>' + s.totals.blockers + '</b> блокеров за всё время' : '');

  document.getElementById('specRuns').innerHTML = s.entries.length
    ? s.entries.map((e) => '<button class="specrow" data-go="#' + esc(e.id) + '">' +
        '<span class="specdot' + (e.running ? ' on' : '') + '"></span>' +
        '<span class="kindchip' + (e.kind === 'refine' ? ' refine' : '') + '">' + (e.kind === 'refine' ? 'refine' : 'ship') + '</span>' +
        '<span class="lead"><span class="nm">' + esc(e.label) + ' ' + verdictChip(e.status) + '</span>' +
        '<span class="sub">' + (e.detail ? esc(e.detail) + ' · ' : '') +
          (e.startedAt ? hhmm(e.startedAt) : '') +
          (e.blockers ? ' · ' + e.blockers + ' блок.' : '') + (e.notes ? ' · ' + e.notes + ' зам.' : '') +
          (e.branch ? ' · ' + esc(e.branch) : '') + '</span></span>' +
        '<span class="num"><b>$' + e.costUsd.toFixed(2) + '</b>' + wallOf(e.wallSec) + '</span></button>').join('')
    : '<p class="dim">По этой спеке ещё ничего не запускали.</p>';
}

/* The hash is the whole of the navigation state, so a reload lands where the reader was and a
   link is worth sending to someone. */
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (IDX && (!h || h === 'specs')) { show('index'); renderIndex(); crumbs(); return; }
  if (h.startsWith('spec:')) { openSpec = h.slice(5); show('spec'); renderSpec(openSpec); crumbs(); return; }
  if (h && h !== D.runId) { wanted(h); return; }
  show('run');
  crumbs();
}

document.addEventListener('click', (e) => {
  const go = e.target.closest('[data-go]');
  if (!go) return;
  e.preventDefault();
  location.hash = go.dataset.go.replace(/^#/, '');
  route();
});
addEventListener('hashchange', route);

/* Asking for a run the page is not holding: the payload has to arrive before it can be drawn,
   so the switch happens when it does. */
let wanted = () => {};

/* ── live ───────────────────────────────────────────────────────────────
   Served over http by run-watch.mjs, the page follows the run: the watcher pushes a fresh
   payload whenever the run directory changes, and the whole view is drawn again from it.
   Opened as a file it stays exactly what it was — a snapshot — because a file:// page has the
   null origin and may not fetch its own directory. */
if (location.protocol === 'http:' || location.protocol === 'https:') {
  const live = document.createElement('div');
  live.className = 'livebadge';
  live.textContent = '● следит';
  document.body.appendChild(live);

  let es = null;
  let shown = D.runId;

  /* Switching runs keeps nothing: the ids belong to the run that is leaving, so an open step
     or a chosen tab would either miss or, worse, land on an unrelated step that happens to be
     called review-2 as well. */
  function reset() {
    openIds.clear(); activeTab.clear();
    activeFilter = 0; allOpen = false; cursor = 0; first = true;
  }

  function connect(entry) {
    if (es) es.close();
    live.classList.remove('lost');
    live.textContent = '● следит';
    es = new EventSource('feed' + (entry ? '?entry=' + encodeURIComponent(entry) : ''));

    /* The index is pushed to everyone on every change, whichever view they are on: a run that
       starts while somebody is reading another one has no watcher to attach, and a board that
       only learns about it on reload is blind exactly when someone is looking. */
    es.addEventListener('index', (ev) => {
      IDX = JSON.parse(ev.data);
      if (view === 'run') crumbs(); else route();
      if (!location.hash) route();
    });

    es.addEventListener('payload', (ev) => {
      const next = JSON.parse(ev.data);
      if (next.runId !== shown) { reset(); shown = next.runId; }
      D = next;
      /* Drawn only where it is visible. A payload arriving while the reader is on the index is
         still kept, so opening the run is instant and never shows the state it had on load. */
      if (view === 'run') render();
      beat();
    });

    es.onerror = () => { live.textContent = '○ связь потеряна'; live.className = 'livebadge lost'; };
  }

  /* A run asked for from a list: already held, so draw it; otherwise the switch waits for the
     payload the reconnect brings. */
  wanted = (id) => {
    if (id === shown) { show('run'); render(); crumbs(); return; }
    connect(id);
    const once = (ev) => {
      if (JSON.parse(ev.data).runId !== id) return;
      es.removeEventListener('payload', once);
      show('run');
      crumbs();
    };
    es.addEventListener('payload', once);
  };

  /* What the badge says is the difference between "thinking" and "stopped", which is the one
     question a page like this has to answer and the one an animation cannot. A run in flight
     shows how long the journal has been quiet; a finished one shows when it last changed. */
  function beat() {
    const now = tick();
    if (!D.totals.running) {
      live.className = 'livebadge';
      /* On a run that has stopped, when it last did anything is the useful number. When the
         page was generated is not — that is a fact about the page. */
      live.textContent = D.lastEventAt
        ? '● последняя активность ' + hhmm(D.lastEventAt)
        : '● обновлено ' + hhmm(D.generatedAt);
      return;
    }
    const quiet = D.lastEventAt ? (now - D.lastEventAt) / 1000 : null;
    live.className = 'livebadge' + (quiet != null && quiet > 180 ? ' stalled' : quiet != null && quiet > 60 ? ' quiet' : '');
    live.textContent = quiet == null ? '● идёт' : '● идёт · тихо ' + mmss(quiet);
  }

  setInterval(beat, 1000);

  const hash = decodeURIComponent(location.hash.slice(1));
  connect(hash && !hash.startsWith('spec:') ? hash : null);
}

route();
</script>
</body></html>
