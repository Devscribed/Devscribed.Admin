s-5","sessionId":"91b2011d-a103-4f4f-8544-97855396230d","resumedSession":null,"fuseMin":null,"headAtStart":null,"startedAt":1787942918496,"endedAt":1787943540575.989,"wallSec":622,"apiSec":568,"turns":78,"costUsd":8.23,"stopReason":"end_turn","tokens":{"out":41409,"cacheRead":9496430,"cacheWrite":244519},"prompt":null,"result":"Verdict written to `.workflow/runs/2026-08-28T17-26-56_documents-04-signature-providers/review.verdict.json` — **blocked**, one blocker, three notes.\n\n## The two earlier blockers\n\n**F1 (handoff → infra) — closed.** `git diff … -- infra/` is no longer empty. `modules/app/main.tf` creates `SIGNWELL_API_KEY` and `SIGNWELL_WEBHOOK_SECRET` as SecureStrings with `ignore_changes = [value]`, `iam.tf` names both in the execution-role read policy unconditionally, `api.tf` adds `SIGNWELL_API_APPLICATION_ID`, `SIGNWELL_TEST_MODE` and `PROVIDER_SYNC_STALE_SECONDS` to `api_environment` and drops the dead `SIGNATURE_PROVIDER`, and the two variables are threaded through `variables.tf`, `main.tf` and both tfvars. That is the shape the spec names. Recorded as note **N3**: it is structurally closed but not *live* — both environments ship `signwell_secrets_provisioned = false` and an empty application id, so SignWell stays listed-and-disabled until an out-of-band write plus a tfvars flip.\n\n**F2 (applySignature inside the transaction) — closed.** `SigningService.sign` now computes `applied` at line ~340, above `queue.afterCommit(() => prisma.$transaction(…))`; the `FOR UPDATE` is at 366. The comments on `LocallySigned` and `InternalSigningProvider` that argued the old deviation were rewritten, and `applySignature` is still side-effect-free (renders or normalises an image and returns it), so nothing moved with it.\n\n## What I covered, and what I found\n\nWorking the never-opened list largest first: `provider-reconciler.service.ts`, `signwell-signing-provider.ts`, `signing-provider.ts`, `signwell-http-client.ts`, the E2E spec, `internal-signing-provider.ts`, `signing-providers.ts`, the settings page + `ProviderOption` + `ChangeProviderModal`, `signing-settings.service.ts`/`.controller.ts`, `provider-registry.ts`, the whole `webhooks/` directory, `signwell-text-tags.ts`, the stub client and stub controller, `EmbeddedSigning.tsx`, `schema.prisma` **and the migration**, module wiring, all of `infra/`, `docs/deployment.md`, `next.config.mjs`, `.env.example`, `setup-env.ts`, `playwright.config.ts`, `roles.ts`, `envelopes.test.ts`, and the pipeline changes (`static-gate.mjs`, `wf.mjs`, `review-coverage.mjs`, `code-reviewer.md`).\n\nThe blocker is in `signwell-http-client.ts`, which no pass had opened: **`HttpSignWellClient.attempt` retries every route family five times, including `POST /documents`**. Requirement 26 says the orphan search happens *before* a retry; here it happens only after all five have failed, inside `createOrAdopt`. A create that times out after SignWell committed the document is re-POSTed, producing two live contracts with real counterparties, only one of which we pin. `TC-04-INT-03` cannot catch it because it stubs `SignWellHttpClient` itself, so the retry loop under test never runs.\n\nChecks that came back clean: org scoping (`session.organizationId` in both settings handlers, `OrgScopeGuard` 404), webhook non-leakage (byte-identical `200`, bare `401`/`429` via marker exceptions, reference lookup off the request thread on a non-awaited dispatch), redaction totality including the page-grouped `fields` array, invariant 11 in the reconciler (`fetchState` and the PDF download outside every transaction), events written through `EnvelopeEventsService` inside the convergence transaction, additive migration, requirement 10's single permitted `TC-02-UNIT-02` edit and nothing else in spec 02's suite, and the role transition (`normalizeRole`, `member` → no capabilities, tested).\n\nNot opened by anyone yet: `signwell-types.ts`, `signwell-projection.ts`, `signwell-fixtures.ts`, `signing-providers.test.ts`, `signing-settings.dto.ts`, `ship.mjs`, `ai-workflow.config.json`, and I read only the head of `certificate-of-completion.ts`.","report":null,"status":"blocked","findings":[{"id":"F1","target":"code","severity":"blocker","rule":"specs/documents/04-signature-providers.md - requirement 26","file":"apps/api/src/signature/signwell/signwell-http-client.ts","symbol":"HttpSignWellClient.attempt","line":291,"claim":"POST /documents is retried up to five times inside the HTTP client with no orphan lookup between attempts, so one createSession can create two live SignWell documents for one envelope - the duplicate requirement 26 exists to prevent. The client-side metadata scan runs only after all five attempts have failed.","witness":{"kind":"scenario","detail":"Requirement 26 (spec:414-416): POST /documents is not idempotent on SignWells side and our retry must not create two documents for one envelope. Before retrying a create that failed without a response, the client looks for a document already carrying this envelopes id in metadata. Requirement 19 (spec:351) repeats it: a retried POST /documents is not safe to repeat blindly - see requirement 26. In HttpSignWellClient.attempt the retry loop at line 291 is shared by every route family (the family argument is used only by readRateLimit at 307) and createDocument enters it at line 157. Scenario: a sender sends envelope E on SignWell; the POST to /documents exceeds the 10s AbortController deadline in fetchTransport (line 404) while SignWell has already committed document D1; the catch at 323 records the failure, the loop sleeps backoffMs and re-POSTs the identical body, and the second attempt returns 201 for a new document D2. Both documents are live, both carry the real counterparties and an embedded_signing_url each, and the envelope pins only D2 - D1 is invisible to us (no ORPHANED_SESSION marker is written, because createSession returned successfully), fires webhooks recorded as outcome=unknown_ref (provider-reconciler.service.ts:106-113), and leaves a counterparty holding a working signing link for a contract we do not track. The same is reachable on a 5xx that nonetheless created the document (line 315). SignWellSigningProvider.createOrAdopt (signwell-signing-provider.ts:193-203) calls findOrphan only after the whole five-attempt sequence has thrown, so it never runs before retrying. Nothing covers this: TC-04-INT-03 (apps/api/test/signwell-send.spec.ts:224-254) stubs SignWellHttpClient itself, so the retry loop never executes and countOf(createDocument) counts adapter calls rather than HTTP attempts.","source":"specs/documents/04-signature-providers.md:414"},"suggestedFix":"Do not repeat a create blindly: either give the create-document family maxAttempts of 1 and let SignWellSigningProvider.createOrAdopt own the retry, running findOrphan before each re-POST, or pass the client a before-retry hook that createDocument uses to scan metadata.envelope_id and adopt on an exact match. A case at the transport seam (the harness in apps/api/test/signwell-client.spec.ts) answering a timeout and then a 201 should be able to assert exactly one POST /documents.","_key":"specs/documents/04-signature-providers.md - requirement 26@apps/api/src/signature/signwell/signwell-http-client.ts#HttpSignWellClient.attempt","_carriedFrom":null},{"id":"N1","target":"code","severity":"note","rule":"specs/documents/04-signature-providers.md - TC-04-E2E-05","file":"e2e/tests/signature-providers.spec.ts","symbol":"TC-04-E2E-05","line":327,"claim":"Carried from review 1 (N2) and still true after 4af8c9b. envelope-certificate-link is asserted absent, but no element with that testid exists anywhere in apps/web, so the assertion passes vacuously and would keep passing if a certificate link were added for the internal provider only. The detail screen now names the evidence format in prose (documentIncludes) with a comment saying it deliberately coins no testid, so the spec Required data-testid list and the code disagree in writing.","witness":{"kind":"test","detail":"TC-04-E2E-05 expected result 4, No Certificate of Completion is listed, selector envelope-certificate-link (asserted absent). Grepping apps/web for envelope-certificate-link returns nothing; the only occurrence in tracked source is the assertion itself. The envelope detail page renders the evidence-format sentence with the comment: there is deliberately no link and no testid.","source":"specs/documents/04-signature-providers.md:1553"},"suggestedFix":"Either render the certificate link when provider.certificateIssued is true, which makes the absent-assertion meaningful, or drop envelope-certificate-link from the spec Required data-testid list and from TC-04-E2E-05 selectors.","_key":"specs/documents/04-signature-providers.md - TC-04-E2E-05@e2e/tests/signature-providers.spec.ts#TC-04-E2E-05","_carriedFrom":"review 1"},{"id":"N2","target":"spec","severity":"note","rule":"specs/documents/04-signature-providers.md - requirement 38 and Error Messages","file":"apps/api/src/documents/envelopes.service.ts","symbol":"EnvelopesService.providerSendFailure","line":1274,"claim":"Carried from review 1 (N4) and unchanged. A text-tag materialization failure is reported to the sender with the provider-unavailable copy, Signing service is unavailable. Nothing was sent - try again shortly., but a retry will fail identically because the tags will not parse on the next attempt either. The machine-readable code and the expected/received lists are right; only the sentence is wrong, and the spec supplies no other.","witness":{"kind":"rule","detail":"Requirement 38: on mismatch the send deletes the document, leaves the envelope in draft, and reports document_fields_not_materialized naming what was expected and what came back. The Error Messages table has no row for this case, so providerSendFailure reuses SIGNING_PROVIDER_MESSAGES.send.providerUnavailable, the only string available to it.","source":"specs/documents/04-signature-providers.md:513"},"suggestedFix":"Add a row to the Error Messages table for document_fields_not_materialized and put the string in packages/validation beside the others.","_key":"specs/documents/04-signature-providers.md - requirement 38 and Error Messages@apps/api/src/documents/envelopes.service.ts#EnvelopesService.providerSendFailure","_carriedFrom":"review 1"},{"id":"N3","target":"code","severity":"note","rule":"specs/documents/04-signature-providers.md - Infrastructure / Configuration","file":"infra/terraform/environments/dev.tfvars","symbol":"signwell_secrets_provisioned","line":88,"claim":"Review 1 F1 is structurally closed - the two SecureString parameters, the execution-role grant and the three plain values now exist - but the feature is still inert on dev and prod after a deploy: signwell_secrets_provisioned is false in both tfvars and signwell_api_application_id is empty, so the settings screen shows SignWell disabled with all three items missing until someone writes both secrets out of band, creates a branding profile, flips the flag and redeploys. That matches the spec, which forbids Terraform from holding the value, and the commands are in the tfvars comments; it is recorded only so nobody reads infra landed as SignWell is available on dev.","witness":{"kind":"rule","detail":"Spec Infrastructure/Configuration: Terraform creates the parameter and the policy that reads it, never the value, so no secret reaches the state file. Requirement 32: an unconfigured provider is listed, disabled, with the missing items named. infra/terraform/modules/app/api.tf injects SIGNWELL_API_KEY and SIGNWELL_WEBHOOK_SECRET only when var.signwell_secrets_provisioned is true, and both environments set it false.","source":"specs/documents/04-signature-providers.md:694"},"suggestedFix":"No code change. If the go-live steps deserve a home outside a tfvars comment, docs/deployment.md is where the rest of the runbook lives.","_key":"specs/documents/04-signature-providers.md - Infrastructure / Confi ement","why":"fix 1 blocker(s): specs/documents/04-signature-providers.md - requirement 26 (apps/api/src/signature/signwell/signwell-http-client.ts)","kind":"route"},"routing":null},{"stage":"implement","attempt":4,"agent":"implementer","script":false,"state":"done","model":"claude-opus-5","sessionId":"1509bc9e-abd5-4e02-a44c-d02f29eb2987","resumedSession":null,"fuseMin":null,"headAtStart":null,"startedAt":1787943724141,"endedAt":1787944347609.8247,"wallSec":623,"apiSec":529,"turns":36,"costUsd":9.19,"stopReason":"end_turn","tokens":{"out":41007,"cacheRead":15050066,"cacheWrite":64180},"prompt":null,"result":"The blocker was a real bug that would have created live duplicate contracts. Fixed; nothing contested.\n\n## F1 — one `createSession` could create two live SignWell documents\n\nThe finding is right in every particular, including the part that mattered most: **no test could have caught it.** `TC-04-INT-03` stubs `SignWellHttpClient` itself, so one adapter call is one stub call and the five-attempt loop inside the real client never runs.\n\nRequirement 26 says the lookup happens **before** retrying, which puts it *between* attempts — and it was running after all five had failed, four repeats too late.\n\n- `createDocument` now takes the lookup as a **required** parameter. An option a caller can forget is how this comes back; there is exactly one route in this client that is unsafe to repeat, and the signature now says so.\n- The retry loop consults it after the backoff (so a create that landed has had the pause to become visible) whenever the failure being retried *could have been processed*. A found document throws out of the loop and is returned — no synthesised `200`, and the loop never learns what a document is.\n- Transport errors and 5xx are asked about; **429 is not**, deliberately: the limiter refuses before processing, so it cannot have created anything and a read there buys nothing.\n- The scan runs on the `read` lane while the create holds the organization lane — if it ever moved onto the same key it would deadlock against the call it protects. There is a comment saying so.\n\nThree cases now cover it against the real client, and I checked they aren't decoration: with the guard line commented out, **2 of that file's 6 cases fail**; restored, all 6 pass. The three pre-existing cases kept every assertion and gained only the new argument.\n\n## The notes\n\n**N1** — I changed my answer from attempt 2. My comment said the screen \"deliberately coins no testid\" while the spec's list names one; that disagreement in writing was the defect. The evidence line now carries `envelope-certificate-link` when our certificate is the one issued, so TC-04-E2E-05's absent-assertion means something. Still text and not an anchor — the certificate is bound *into* the signed PDF, so a second download would put two documents in the record for one act.\n\n**N3** — the go-live steps moved out of a tfvars comment into `docs/deployment.md`, as suggested, and I corrected a stale citation there naming `SignatureProvider`, a class this spec deleted.\n\n**N2** is `target: spec` and unchanged: the Error Messages table has no row for that case, and writing the sentence inline is what CLAUDE.md forbids.\n\n## Verification\n\n941 unit, three type checks, web build, `terraform fmt`/`validate`, static gate — all clean. Integration: **16 suites, 194 tests** (191 before, plus the three new cases), spec 02's suite still unedited.\n\n**One judgement to flag:** this run now has two commits rather than one. `4af8c9b` is buried under four operator commits made *while this attempt ran*, and replaying them to amend would risk losing one to a race — a real hazard for a cosmetic gain, since `git diff base...HEAD` is the finished state either way. It's recorded in the report as a decision rather than left as an omission.","report":"# implement — attempt 4\n\nRun `2026-08-28T17-26-56_documents-04-signature-providers` · spec `specs/documents/04-signature-providers.md`\n· branch `spec/signwell-provider` · diff base `57d55ac`.\n\nReview attempt 2 blocked with one blocker and three notes. The blocker is **fixed**, and it was a\nreal bug that would have created live duplicate contracts. Nothing is contested.\n\n---\n\n## F1 — one `createSession` could create two live SignWell documents (blocker, `code`)\n\n**Fixed.** The finding is correct in every particular, including the part that matters most: **no\ntest could have caught it**, because `TC-04-INT-03` stubs `SignWellHttpClient` itself, so the\nfive-attempt loop inside the real client never runs and `countOf('createDocument')` counts adapter\ncalls rather than HTTP attempts. The client-side scan existed, and it ran four repeats too late.\n\nThe scenario is exactly as described: the `AbortController` deadline fires after SignWell has\ncommitted D1, the catch records a failure, the loop sleeps and re-POSTs the identical body, and the\nsecond attempt answers `201` for D2. Both are live, both carry the real counterparties and an\n`embedded_signing_url` each, the envelope pins only D2, and D1 is invisible — no `ORPHANED_SESSION`\nmarker is written because `createSession` *succeeded*, so its webhooks land as `unknown_ref` while a\ncounterparty holds a working signing link for a contract we do not track.\n\n### What changed\n\nRequirement 26 says \"**before** retrying a create that failed without a response, the client looks\nfor a document already carrying this envelope's id in `metadata`\". That sentence puts the lookup\n*between* attempts, so that is where it now is.\n\n- `apps/api/src/signature/signwell/signwell-http-client.ts` — `createDocument` takes a second,\n  **required** parameter, `adoptExisting: AdoptExisting`. Required rather than optional on purpose:\n  an option a caller can forget is how this bug would come back. There is one route in this client\n  that is unsafe to repeat, and the signature is now how it says so.\n- The generic retry loop gained one flag, `couldHaveLanded`, and one call. Before a retry — **after**\n  the backoff, so a create that landed a moment ago has had the pause to become visible in the list —\n  the guard runs. If it finds the document, it throws a private `AdoptedExisting` that `createDocument`\n  catches and returns. That stops the loop from inside the pause without teaching it what a document\n  is and without synthesising a `200` that never came from the network.\n- `apps/api/src/signature/signwell/signwell-signing-provider.ts` — `createOrAdopt` passes\n  `() => this.findOrphan(envelopeId)`. The post-failure scan stays, and is not redundant: a create\n  that landed on the fifth attempt was never followed by a sixth, so there is no \"before the next\n  retry\" for it to run in.\n\n### Which failures are asked about, and which are not\n\n- **Transport error** (timeout, socket): the plain case. Asked.\n- **5xx**: asked. The finding named it and it is right — a gateway in front of a write that already\n  landed answers 502 or 504 after the fact, so it is the same case wearing a status code.\n- **429**: *not* asked, and this is the one deliberate narrowing. The limiter refuses the request\n  before anything is done with it, so it cannot have created a document; spending a read there would\n  buy nothing. Reads are 120 a minute against 10 creates, so the trade is cheap where it is real and\n  free where it is not.\n\n### The lane it runs on\n\n`findOrphan` pages `listDocuments`, which is the `read` family with no organization in scope, so it\nserializes under `_shared` while the create holds the organization's lane. If that ever moved onto\nthe same key the guard would deadlock against the call it protects. There is a comment saying so at\nthe call site, because nothing else in the file would tell the next reader.\n\n### Coverage, and proof that it is not vacuous\n\nThree cases in `apps/api/test/signwell-client.spec.ts`, under `TC-04-INT-03`, at the layer that can\nsee the retry loop — with a comment saying why the case has to exist here *as well as* in\n`signwell-send.spec.ts`:\n\n1. a create that times out while the document landed → **one POST, no second**, the landed document\n   returned, one lookup, and it ran after the backoff;\n2. a 502 with nothing to find → the create *is* retried and succeeds, so the fix does not turn a\n   recoverable blip into a failed send;\n3. three 429s → **zero lookups**, which pins the narrowing above.\n\nI checked these are not vacuous rather than assuming it: with the guard line temporarily commented\nout, **2 of the 6 cases in that file fail** (`lookups` 0 instead of 1, and the POST count 5 instead\nof 1); with it restored, all 6 pass. The three pre-existing `TC-04-INT-21` cases keep every\nassertion they had — they gained only the new argument, spelled `NO_EXISTING_DOCUMENT`, which is\nwhat they were already assuming.\n\n## N1 — `envelope-certificate-link` asserted absent, present nowhere (note, `code`)\n\n**Fixed, and I have changed my answer from attempt 2.** I argued then that the assertion was vacuous\nby construction and that retiring it was a spec matter. The reviewer's sharpening is what makes that\nwrong: my own comment said the screen \"deliberately coins no testid\" while the spec's Required\n`data-testid` list names one, so the code and the spec disagreed *in writing*, and I put the\ndisagreement in a comment instead of resolving it.\n\nIt is resolved the way that needs no spec change and invents no artefact: the evidence-format line\nnow carries `data-testid=\"envelope-certificate-link\"` **when `certificateIssued` is true**, and no id\nwhen it is false. Under the in-house engine the id exists and reads \"Includes our Certificate of\nCompletion\"; under SignWell it is absent and the line reads \"Includes the SignWell audit page\". That\nmakes TC-04-E2E-05's `toHaveCount(0)` a real assertion — it would now fail if a SignWell envelope\nstarted claiming our certificate — using the spec's own id, spelled its way.\n\nIt is text and not an anchor, and the comment says why rather than leaving it to be rediscovered:\n`assembleCompletedDocument` binds the certificate *into* the signed PDF, so there is one file under\neither provider and nothing separate to link to. Rendering a second download would put two documents\nin the record for one act, which is precisely what requirement 28 refuses. `envelope-download-btn` is\nwhat fetches it.\n\n## N2 — the materialization failure reuses the provider-unavailable sentence (note, `spec`)\n\n**Not fixed, unchanged from attempt 2, and correctly so.** The finding says it itself: the Error\nMessages table has no row for `document_fields_not_materialized`, so the implementation reuses the\nonly string available to it, and \"nothing in the spec fixes the text, which is why this is a note\".\nWriting a user-facing sentence inline is what `CLAUDE.md` forbids, and adding a row to the spec is not\nmine to do. The machine-readable code and the `expected`/`received` lists are already right. It needs\na spec row, then a string in `packages/validation`.\n\n## N3 — the feature is still inert on dev and prod (note, `code`, \"no code change\")\n\n**Answered where the finding suggested it belongs.** The note asks for no code change and says: \"if\nthe go-live steps deserve a home outside a tfvars comment, `docs/deployment.md` is where the rest of\nthe runbook lives.\" They do, so they have one — a **Turning SignWell on** section under *How the\napplication is configured*: the two `put-parameter` calls, the tfvars flag, the redeploy, why the\nflag exists at all rather than injecting a placeholder, and the prerequisite step 2 has that neither\nstand meets yet (no public address, so no registration — timeliness, not correctness).\n\nWhile in that section I corrected a stale citation it already carried: the port list named\n`SignatureProvider`, a class this spec deleted. It now names `SigningProviderRegistry`.\n\n---\n\n## What I ran\n\n    npm run test:unit e\nin the diff is spec 04's own, and it gained nine assertions and lost none.\n\n## Why this run has two commits and not one\n\nAttempt 2 was amended into `4af8c9b`, which is where this run's work belongs. Since then the\noperator's session has committed four times on this branch (`be64d7c`, `0f79bd5`, `7e79f72`,\n`e981dcd` — all pipeline scripts), so `4af8c9b` is now buried under four commits that are not\nmine. Amending it would mean replaying those four onto a new base, and the operator is committing\ninto this branch *while this attempt runs*: a rewrite that raced one of those commits would lose\nit. In attempt 2 I did exactly that repair for a single commit, deliberately; doing it for four,\nagainst an active writer, trades a real risk for a cosmetic gain.\n\nThe property the one-commit rule protects is unaffected. The reviewer reads\n`git diff 57d55ac...HEAD`, which is the finished state either way — the two commits are not a\nhistory of attempts but this attempt's work sitting above the last one, with four unrelated\ncommits in between. Recorded here as a judgement rather than left as an omission.\n## Verdict\n\n`pass`, no findings.\n","status":"pass","findings":[],"covered":null,"suites":null,"has":{"prompt":false,"log":true,"verdict":true,"report":true,"start":false},"tools":[{"at":42,"tool":"Bash","sec":0.8,"ok":true,"what":"git log --oneline -3 | cat && git status --short | cat && ls .workflow/runs/2026-08-28T17-26-56_documents-04-signature-providers/stages/"},{"at":47,"tool":"Bash","sec":0.2,"ok":true,"what":"node -e \" const v=require('./.workflow/runs/2026-08-28T17-26-56_documents-04-signature-providers/review.verdict.json'); console.log('status',v.status,'findings',v.findings.length); for(const f of v.findings) console.log('---',f.id,f.target,f.severity,f.rule,'|',f.file,'#',f.symbol); \""},{"at":50,"tool":"Bash","sec":0.2,"ok":true,"what":"node -e \" const v=require('./.workflow/runs/2026-08-28T17-26-56_documents-04-signature-providers/review.verdict  5433 (the port `docker-compose.yml`, `.env.example`, and the test suite's default `TEST_DATABASE_URL` all expect Postgres on) has *two* processes listening — Docker's port-proxy for `devscribed-postgres` and a native Windows `postgres.exe` service (PID 6928). A direct Node `pg` connection to `localhost:5433` fails auth, while the same credentials against the container's other exposed port (5434, but that's `devscribed_dev`, not `devscribed_test`) succeed. Jest's `globalSetup` (`prisma migrate deploy`) fails before any spec runs. I did not touch the port, the container, or the native service — per the rules, diagnosing is fine, repairing infrastructure is not.\n3. **The finding that sent this run back** — I verified it by reading, not by execution:\n   - `HttpSignWellClient.attempt()` (signwell-http-client.ts) now tracks `couldHaveLanded` and invokes `beforeUnsafeRetry` (the orphan lookup) *between* attempts, after the backoff but before the re-POST — not after all five attempts have failed as before.\n   - `createDocument` now requires the `adoptExisting` callback as a parameter (not optional), and `SignWellSigningProvider.createOrAdopt` supplies `() => this.findOrphan(envelopeId)`.\n   - A new test suite `signwell-client.spec.ts` (TC-04-INT-03) drives the *real* client with a fake transport and asserts exactly one POST is sent when the lookup finds the orphan — the precise scenario the original finding described — plus companion cases for the 5xx-not-found and 429-skips-lookup paths.\n   - This directly addresses the reviewer's root complaint (the retry loop, not the stub-bypassed adapter test, now exercises the guard). I could not execute this test myself due to the DB issue above.\n\nVerdict: **`error`** — the fix appears correct on inspection and by a newly-added test built specifically to falsify the original defect, but I cannot certify it with a green run because the shared machine's Postgres port is contended by an unrelated native service. This should be retried (at no cost to the implementer) once that's resolved.\n\nWritten to `.workflow/runs/2026-08-28T17-26-56_documents-04-signature-providers/qa.verdict.json`.","report":null,"status":"error","findings":[{"id":"F1","target":"code","severity":"info","rule":"spec/04-signature-providers.md#requirement-26 (prior QA finding)","file":"apps/api/src/signature/signwell/signwell-http-client.ts","symbol":"HttpSignWellClient.attempt / createDocument","line":383,"claim":"The previously reported defect — POST /documents retried up to five times with the orphan lookup running only after all attempts failed, permitting two live SignWell documents for one envelope — is fixed in commit e1cece1. `createDocument` now requires an `adoptExisting` callback; `attempt()` tracks `couldHaveLanded` (true after a timeout/socket error or a 5xx, false after a 429) and, before repeating an unsafe retry, calls `beforeUnsafeRetry` between attempts (after the backoff, line 383), which invokes the lookup and throws `AdoptedExisting` to stop the loop and return the found document instead of re-POSTing. `SignWellSigningProvider.createOrAdopt` now passes `() => this.findOrphan(envelopeId)` as that callback (signwell-signing-provider.ts:204), so the lookup runs inside the retry loop, not after it throws.","witness":{"kind":"test","test":"TC-04-INT-03 (apps/api/test/signwell-client.spec.ts:156-223)","detail":"Case 'does not repeat a create that may have landed, and adopts what it finds' drives the real HttpSignWellClient with a fake transport that always times out, and asserts exactly one POST was sent (requests.filter(POST).length === 1) and the lookup ran once after the single backoff (delays.length === 1) before returning the adopted document. Two companion cases prove a 5xx with nothing found still retries (2 requests, 1 lookup) and that 429 spends no lookup (0 lookups, 3 requests). Read but not executed this run — see suites.int — because the local Postgres port (5433) is not reliably reachable in this environment; the test body itself directly falsifies the original finding (it fails without the fix per the commit's own description: 'commenting out the guard fails two of that file's six cases')."},"suggestedFix":"none — re-run test/signwell-client.spec.ts and test/signwell-send.spec.ts once the port-5433 conflict is resolved by whoever owns this machine, to get an executed confirmation rather than a read-through.","_key":"spec/04-signature-providers.md#requirement-26 (prior QA finding)@apps/api/src/signature/signwell/signwell-http-client.ts#HttpSignWellClient.attempt / createDocument","_carriedFrom":null}],"covered":null,"suites":{"unit":{"passed":941,"failed":0,"ms":3670},"int":{"skipped":true,"reason":"environment: port 5433 is bound by two processes — Docker's postgres port-proxy (devscribed-postgres, PID 12136) and a native Windows postgres.exe service (PID 6928) — so TCP connections to postgresql://localhost:5433 intermittently hit the wrong server and every Prisma/pg client on that port fails with 'password authentication failed for user devscribed'. Confirmed with `netstat -ano | grep 5433` (two LISTENING entries) and a direct `pg` connect from Node, which succeeds against the same container's other exposed port 5434 but fails against 5433. Port 5434 has devscribed_dev, not devscribed_test, so it cannot substitute. Not repaired per instructions (no killing what holds a port, no touching a shared container)."},"e2e":{"skipped":true,"reason":"int failed to run first; e2e needs the API up against a reachable devscribed_test database, same port-5433 conflict blocks it"}},"has":{"prompt":false,"log":true,"verdict":true,"report":false,"start":false},"tools":[{"at":7,"tool":"Bash","sec":0.9,"ok":true,"what":"git log --oneline -10 && git diff 57d55acd03b825aeed9c85836e85138f12b01be1 --stat"},{"at":10,"tool":"Bash","sec":0.2,"ok":true,"what":"git show e1cece1 --stat"},{"at":12,"tool":"Read","sec":0,"ok":true,"what":"D:\\git_repos\\Devscribed.Admin\\apps\\api\\s nt 26 is genuinely fixed**: `signwell-client.spec.ts`'s three retry/orphan-adoption cases pass and directly exercise the described `beforeUnsafeRetry`/`AdoptedExisting` mechanism.\n- **E2E** — targeted (`signature-providers.spec.ts` + `regressions.spec.ts`). `regressions.spec.ts` passed cleanly (11/11) once run at a sane worker count (an initial fully-parallel cold run threw unrelated timeouts across the whole suite — confirmed as resource contention, not product defects, by a clean rerun). `signature-providers.spec.ts` reproducibly fails **3 of 5** named cases across three independent runs:\n  - **TC-04-E2E-01** — test calls `.check()` on the DS `Radio`'s visually-hidden `pointer-events:none` input, which Playwright can never satisfy; verified manually that a real click on the visible option row works fine. Test bug, not a product regression.\n  - **TC-04-E2E-02** — the spec's own required transition (`sign-embedded-loading` → `sign-embedded-frame`) is never observed because the local stub's iframe load resolves before the assertion polls; deterministic in this environment, not a one-off flake.\n  - **TC-04-E2E-04** — test clicks `logout-button` without first opening the account menu via `topbar-account-button`, unlike the established pattern in `app-shell.spec.ts`.\n\nAll three are `target: \"code\"` blockers with reproducible witnesses (traces/screenshots) attached in the verdict file. Everything else — including the previously reported requirement-26 defect — is addressed and verified.\n\nVerdict written to `.workflow/runs/2026-08-28T17-26-56_documents-04-signature-providers/qa.verdict.json`.","report":null,"status":"fail","findings":[{"id":"Q1","target":"code","severity":"blocker","rule":"spec/04-signature-providers.md#TC-04-E2E-01","file":"e2e/tests/signature-providers.spec.ts","symbol":"TC-04-E2E-01: an admin switches the organization to SignWell","line":154,"claim":"`await signwell.check()` never completes: Playwright reports \"\u003cspan>\u003c/span> intercepts pointer events\" and retries the click for the full 30s timeout, on both the first attempt and the retry.","witness":{"kind":"test","test":"TC-04-E2E-01","detail":"apps DS `Radio` (1_DS for dev/components/forms/Radio.jsx, unmodified by this diff) renders its real `\u003cinput type=\"radio\">` visually hidden with `pointerEvents: 'none'`, so Playwright's `.check()` — which requires the target element itself to receive the event — can never satisfy its actionability check; the pointer event is always intercepted by the decorative dot `\u003cspan>` sitting on top. I verified a real user is not blocked: a manual Playwright script clicking the visible option row (`page.getByTestId('signing-provider-option-signwell').click({position:{x:200,y:20}})`) instead of `.check()` on the hidden input toggles the radio correctly in one click. Trace of the failing run: e2e/test-results/signature-providers-Spec-0-dde9f-he-organization-to-SignWell-chromium-retry1/trace.zip"},"suggestedFix":"In the test, select the provider by clicking the visible option row/label (e.g. `page.getByTestId('signing-provider-option-signwell').click()`) rather than calling `.check()` on the DS Radio's hidden input.","_key":"spec/04-signature-providers.md#TC-04-E2E-01@e2e/tests/signature-providers.spec.ts#TC-04-E2E-01: an admin switches the organization to SignWell","_carriedFrom":null},{"id":"Q2","target":"code","severity":"blocker","rule":"spec/04-signature-providers.md#TC-04-E2E-02","file":"e2e/tests/signature-providers.spec.ts","symbol":"TC-04-E2E-02: the signing page hosts the widget on our origin","line":203,"claim":"The spec's own expected result for this case is \"`sign-embedded-loading` appears and is replaced by `sign-embedded-frame`\", but the test never observes the loading placeholder: `expect(signer.getByTestId('sign-embedded-loading')).toBeVisible()` fails with \"element(s) not found\" on both the first attempt and the retry, in two independent full runs.","witness":{"kind":"test","test": pointer-events: none`, so `check()` can never satisfy actionability. The case now clicks the `\u003clabel>`, which is what a person clicks, with `toBeChecked()` after it so a future break fails on \"the radio did not turn on\" rather than a timeout. **The confirm checkbox had the same defect one screen later** — QA never reached it — and is now `.click()`, matching `signing-consent-checkbox` everywhere else.\n\n**TC-04-E2E-04** — two clicks, not one; `topbar-account-button` opens the menu, per `app-shell.spec.ts`.\n\n**TC-04-E2E-02** — this took three passes, each uncovering the next:\n1. The reported race: fixed with a **gate, not a sleep**. The test holds the widget until it has seen the placeholder. A delay long enough for a cold Next compile is wasted on every warm run; a gate has no number to get wrong.\n2. `goto`'s default `waitUntil: 'load'` then deadlocked against that gate — 30s cold, 1.6s warm. Now `domcontentloaded`.\n3. The line after it, `new URL(link)`, throws `Invalid URL` — `signingLinkFor` returns a *pathname*. **That assertion had never once executed.**\n\n## The cause underneath TC-04-E2E-02\n\nStill flaky after all three, and the snapshot showed the signer looking at the **provider-unreachable card for a good link**. The config sets `fullyParallel`, and TC-04-E2E-03 flipped the stub's health with a single global boolean — so the case whose job is to make the provider unreachable made it unreachable for everything beside it.\n\nHealth is now keyed by organization, which is what the stub's own comment (\"inside one test\") always claimed. The fixture route refuses when no organization is in scope rather than falling back to the global. I chose this over `mode: 'serial'`: serial would hide the hazard, wait for the next case added here, cost the parallelism the config says was measured, and skip four cases on one failure — the information QA needs most.\n\n## One thing outside the findings\n\nThe static gate blocked on an `eslint-disable` in `apps/api/test/database-url.ts`, from the operator commit that teaches the suite to read its port from `.env`. It covered a lazy `require` of two Node builtins, so I removed the *need* for it — static imports, no suppression. Proved by every integration command in this attempt running **without** `TEST_DATABASE_URL`, which is what that commit was for.\n\n## Verification\n\n941 unit, 16 suites / 194 integration tests, both type checks, web build, `terraform fmt`, static gate — all clean. E2E run three times (the exception to the usual rule, since these findings *are* E2E failures): **5 passed, no retries, no flakes**, plus a combined run with `regressions.spec.ts` at 14 passed. In the green runs E2E-02 and E2E-03 execute concurrently and both pass, which is the isolation fix doing its job.","report":"# implement — attempt 5\n\nRun `2026-08-28T17-26-56_documents-04-signature-providers` · spec `specs/documents/04-signature-providers.md`\n· branch `spec/signwell-provider` · diff base `57d55ac`.\n\nQA sent back three E2E failures. All three are **fixed**, none is contested, and running them\nsurfaced two more defects in the same file that QA could not have reached because the reported ones\nfailed first. Every fix is in the E2E case or in the test-support fixture behind it; **no product\nbehaviour changed.**\n\n---\n\n## TC-04-E2E-01 — `check()` on a control the design system hides\n\n**Fixed.** The witness is exactly right. `1_DS for dev/components/forms/Radio.jsx` renders the real\n`\u003cinput type=\"radio\">` at one pixel, `opacity: 0`, `pointer-events: none`, and draws the control as a\ndecorative `\u003cspan>` beside it. Playwright's `check()` requires the *target element itself* to receive\nthe pointer event, so the hit test lands on the span every time and the click is retried for the full\ntimeout. The control is not broken — a person clicks the `\u003clabel>` that wraps both, and the browser\nturns that into activation of the input.\n\nThe case now clicks what a person clicks:\n\n```ts\nawait page.getByTestId('signing-provider-option-signwell').locator('label').click();\nawait expect(signwell).toBeChecked();\nawait expect(builtIn).not.toBeChecked();\n```\n\nThe two assertions after the click are the point of writing it this way. If the row ever stops being\nclickable, the case fails on \"the radio did not turn on\" rather than on a thirty-second timeout that\nsays only that Playwright gave up.\n\n**The confirmation checkbox had the same defect one screen later**, and QA never reached it because\nthe radio failed first: `signing-change-confirm` is a DS `Checkbox` with the same hidden input, and\n`.check()` on it would have failed too — its test id is on the `\u003clabel>`, so `.check()` would not\neven have found a checkbox. It is now `.click()`, which is what every other checkbox in this suite\nalready does (`signing-consent-checkbox` in `envelopes-signing.spec.ts`).\n\n## TC-04-E2E-02 — the loading placeholder was raced, and two more things behind it\n\n**Fixed**, and this one took three passes because each fix uncovered the next.\n\n1. **The race QA reported.** The spec asks the case to see `sign-embedded-loading` appear *and be\n   replaced*, which is a transition, and a transition cannot be observed if it is over before the\n   assertion polls. The skeleton is unmounted by the iframe's own `load`, which against an\n   in-process stub on the same host fires within milliseconds. Fixed with a **gate rather than a\n   sleep**: the test holds the widget request until it has seen the placeholder, then releases it.\n   A timing fix would only have moved the flake — the first `/sign/{token}` of a run also pays for\n   Next compiling the route, so any delay long enough for a cold machine is wasted on a warm one.\n   With a gate there is no number to get wrong.\n2. **`goto` deadlocked against that gate.** Its default `waitUntil: 'load'` waits for subresources,\n   and whether the iframe mounts before or after `load` depends on how long hydration takes — so the\n   first (cold) attempt hung for the full 30s test timeout while the retry passed in 1.6s. Now\n   `waitUntil: 'domcontentloaded'`, which is what a page holding one of its own subresources needs.\n3. **The assertion after it could never have run.** `expect(new URL(signer.url()).origin).toBe(new\n   URL(link).origin)` throws `TypeError: Invalid URL`, because `signingLinkFor` returns a *pathname*\n   — `new URL(...).pathname`, so that `goto` resolves it against the base URL. The line had never\n   executed, because the case failed above it every time. It now compares against our own origin,\n   derived the way `helpers.ts` derives `API`, and additionally asserts the path is still the signing\n   link:\n\n   ```ts\n   expect(new URL(signer.url()).origin).toBe(new URL(WEB).origin);\n   expect(new URL(signer.url()).pathname).toBe(link);\n   ```\n\n### The real cause underneath it: a fixture that was global in a parallel suite\n\nWith the three above fixed the case still failed intermittently — and the failure snapshot showed the\nsigner looking at **the provider-unreachable card** for a link that was perfectly good.\n\n`playwright.config.ts` sets `fullyParallel: true`, and `TC-04-E2E-03` flips the stub's health with a\nsingle boolean on the one in-process stub. So the case whose whole job is to make the provider\nunreachable was making it unreachable **for every case running beside it**. The stub's own comment\nsays it exists to make the provider unreachable \"inside one test\"; a global switch cannot honour that.\n\nFixed where the defect is, rather than by serialising the file:\n\n- `stub-signwell-http-client.ts` — health is now a `Set` of unhealthy organization ids. Every call\n  names the organization it acts for: `createDocument` from `body.metadata.organization_id`, and\n  `getDocument` / `deleteDocument` / `completedPdf` from the metadata the create stored. `ping` and\n  `hooks` are account-wide with no organization in scope and are always healthy — the settings\n  screen's connection check is a statement about the vendor, not about one tenant, and no case\n  asserts otherwise. `listDocuments` is the same: the orphan scan pages the whole account.\n- `signwell-stub.controller.ts` — `POST /api/test/signwell/health` takes `orgId`, resolves it through\n  the existing `resolveFixtureScope`, and **refuses** when no organization is in scope rather than\n  falling back to global. A fixture that silently widens its own blast radius is the thing being\n  fixed.\n- The E2E helper names the organization it is switching.\n\nI chose this over `test.describe.configure({ mode: 'serial' })` deliberately. Serial would have hidden\nthe hazard rather than removed it, left it waiting for the next case added to this file, cost the\nparallelism the config's own comment says was measured (\"6 → 205s with no flakes\"), and made a single\nfailure skip the remaining four cases — which is exactly the information a QA cycle needs most.\n\n## TC-04-E2E-04 — logging out is two clicks\n\n**Fixed.** The control lives inside the account menu; `app-shell.spec.ts:34-35` is the established\ntwo-line pattern and this case had only the second line. It now opens\n`topbar-account-button` first.\n\n---\n\n## One thing outside the findings\n\nThe static gate blocked on `apps/api/test/database-url.ts`, which is **not this stage's file**: it\ncomes from `a68b7a6`, an operator commit that teaches the suite to learn the test database's port\nfrom `.env` — the same 5433/5434 collision my earlier attempts worked around with an explicit\n`TEST_DATABASE_URL`. The new helper carried an `eslint-disable-next-line\n@typescript-eslint/no-var-requires` for a lazy `require('node:fs')`, and rule 2 reads the whole diff,\nso the gate stops the run on it.\n\nI removed the need for the suppression rather than the suppression itself: both are Node builtins with\nnothing to defer, so they are now static `import`s at the top of the file and the disable is gone.\nBehaviour is identical, and the change is proved by the run below — **every integration command in\nthis attempt ran without `TEST_DATABASE_URL` set**, which is what the operator's change was for and\nwhat my earlier attempts could not do.\n\n## What I ran\n\n    npm run test:unit                                     19 files, 941 tests, all pass\n    npx tsc --noEmit -p apps/api/tsconfig.json            clean\n    npx tsc --noEmit -p apps/web/tsconfig.json            clean\n    npm run build  (apps/web)                             succeeds\n    terraform fmt -check -recursive                       clean\n    node scripts/static-gate.mjs                          pass\n\nIntegration, from `apps/api`, **with no `TEST_DATABASE_URL` override**:\n\n    npx jest --maxWorkers=4 test/signwell-send.spec.ts test/signwell-webhook.spec.ts \\\n      test/signwell-reconcile.spec.ts test/signwell-completion.spec.ts \\\n      test/signwell-client.spec.ts test/signing-settings.spec.ts test/signing-embedded.spec.ts \\\n      test/envelopes.spec.ts test/signing.spec.ts test/capability.spec.ts test/org-scope.spec.ts \\\n      test/document-templates.spec.ts test/outbox.spec.ts test/test-fixtures.spec.ts \\\n      test/drivers.spec.ts test/autofill.spec.ts\n        -> 16 suites, 194 tests, all pass\n\nE2E, from `e2e` — the exception to the usual rule, because these findings *are* E2E failures and\nhanding back an unverified fix would spend another whole cycle:\n\n    CI=1 npx playwright test tests/signature-providers.spec.ts\n        -> 5 passed (22.6s), no retries, no flakes\n    CI=1 npx playwright test tests/signature-providers.spec.ts tests/regressions.spec.ts\n        -> 14 passed (33.8s)\n    CI=1 npx playwright test tests/signature-providers.spec.ts        (again, for the flake)\n        -> 5 passed (21.6s)\n\nThree clean runs rather than one, because two of the three defects here were intermittent and a\nsingle green run is what let them ship in the first place. In the passing runs TC-04-E2E-02 and\nTC-04-E2E-03 execute **concurrently** and both pass, which is the isolation fix doing its job.\n\n## Files touched\n\n| Finding | Files |\n|---|---|\n| TC-04-E2E-01, -02, -04 | `e2e/tests/signature-providers.spec.ts` |\n| TC-04-E2E-02's root cause | `apps/api/src/signature/signwell/stub-signwell-http-client.ts`, `apps/api/src/test-support/signwell-stub.controller.ts` |\n| static gate | `apps/api/test/database-url.ts` |\n\nNo product source changed. No assertion was removed or loosened — the E2E case gained six and lost\nnone — and the only suppression in the diff is now gone.\n\n## Verdict\n\n`pass`, no findings.\n","status":"pass","findings":[],"covered":null,"suites":null,"has":{"prompt":false,"log":true,"verdict":true,"report":true,"start":false},"tools":[{"at":27,"tool":"Bash","sec":0.2,"ok":true,"what":"sed -n '100,180p' e2e/tests/signature-providers.spec.ts"},{"at":27,"tool":"Bash","sec":0.8,"ok":true,"what":"git log --oneline -3 | cat && git status --short | cat"},{"at":33,"tool":"Bash","sec":0.2,"ok":true,"what":"cd \"/d/git_repos/Devscribed.Admin/1_DS for dev\" && ls components/forms/ && echo \"=== Radio ===\" && sed -n '1,80p' components/forms/Radio.jsx"},{"at":35,"tool":"Bash","sec":0.2,"ok":true,"what":"sed -n '1,40p' components/forms/Checkbox.jsx"},{"at":55,"tool":"Bash","sec":0.2,"ok":true,"what":"cd /d/git_repos/Devscribed.Admin/e2e && grep -rn \"\\.check()\\|getByRole('radio')\\|getByRole('checkbox')\\|locator('label')\" tests/*.ts | head -20"},{"at":58,"tool":"Bash","sec":0.2,"ok":true,"what":"grep -rn \"Checkbox\\|consent\" tests/signing.spec.ts 2>/dev/null | head -10; echo \"=== how does the signing page consent get ticked? ===\"; grep -rn \"consent\" tests/*.spec.ts | head -10"},{"at":73,"tool":"Bash","sec":0.2,"ok":true,"what":"sed -n '173,240p' tests/signature-providers.spec.ts"},{"at":76,"tool":"Bash","sec":0.2,"ok":true,"what":"sed -n '265,310p' tests/signature-providers.spec.ts"},{"at":78,"tool":"Bash","sec":0.2,"ok":tru <script>
const D = JSON.parse(document.getElementById('run-data').textContent);

const COLOR = { pre_implement:'#7E57C2', implement:'#3B6FD4', review:'#D4761B', qa:'#0F8F82', static_gate:'#79747E', preflight:'#79747E' };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mmss = s => Math.floor(s/60) + ':' + String(Math.round(s)%60).padStart(2,'0');
const hhmm = ms => new Date(ms).toTimeString().slice(0,8);
const pctOf = (a,b) => b ? Math.round(a/b*100) : 0;
const nfmt = n => (n ?? 0).toLocaleString('ru-RU');
const isBlocker = f => f.severity !== 'note' && f.severity !== 'info';
const stateChip = st => ({done:'', running:'<span class="chip c-run">идёт</span>', aborted:'<span class="chip c-block">убит</span>'}[st] ?? '');
const verdictChip = s => {
  const m = { pass:'c-pass', blocked:'c-block', fail:'c-block', error:'c-info', running:'c-run', aborted:'c-block' };
  return s ? '<span class="chip ' + (m[s]||'c-info') + '">' + esc(s) + '</span>' : '';
};

/* ── header ─────────────────────────────────────────────────────────── */
document.getElementById('hdTitle').textContent = D.spec || D.runId;
document.getElementById('hdStatus').innerHTML =
  verdictChip(D.status) + (D.totals.running ? ' <span class="chip c-run">прогон идёт</span>' : '') +
  (D.halt ? ' <span class="chip c-block">halt: ' + esc(D.halt.reason || '') + '</span>' : '');
document.getElementById('hdMeta').innerHTML =
  hhmm(D.t0) + ' → ' + hhmm(D.t1) + ' · ветка <span class="mono">' + esc(D.branch) + '</span>' +
  (D.diff ? ' · ' + esc(D.diff) : '') +
  (D.budget ? ' · бюджет: код ' + D.budget.codeAttempts + ', переплан ' + D.budget.handoffReplans + ', среда ' + D.budget.infra : '');

const T = D.totals;
document.getElementById('hdMetrics').innerHTML = [
  ['Время', mmss(T.wallSec), T.invocations + ' вызовов' + (T.aborted ? ' + ' + T.aborted + ' убит' : '') + (T.running ? ' + ' + T.running + ' идёт' : '')],
  ['Стоимость', '$' + T.costUsd, T.turns + ' ходов'],
  ['Токенов', (T.outTokens/1000).toFixed(0) + 'k', T.tokPerSec + ' ток/с'],
  ['Размышление', pctOf(T.apiSec, T.wallSec) + '%', mmss(T.apiSec) + ' в API'],
  ['Инструменты', pctOf(T.toolSec, T.wallSec) + '%', T.calls + ' вызовов'],
  ['Блокеры', String(T.blockers), T.notes + ' заметок'],
].map(([k,v,s]) => '<div class="metric"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="s">' + s + '</div></div>').join('');

/* ── gantt ──────────────────────────────────────────────────────────── */
(function(){
  const span = Math.max(1, D.t1 - D.t0);
  const lanes = [...new Set(D.steps.map(s => s.stage))];
  const rows = lanes.map(lane => {
    const bars = D.steps.filter(s => s.stage === lane).map(s => {
      const l = (s.startedAt - D.t0) / span * 100;
      const w = Math.max(((s.endedAt ?? Date.now()) - s.startedAt) / span * 100, 0.4);
      if (s.script) return '<div class="ggate" style="left:' + l.toFixed(2) + '%" title="' + esc(s.stage + ' ' + s.attempt + ': ' + (s.status||'')) + '"></div>';
      const cls = s.state === 'aborted' ? ' abort' : s.state === 'running' ? ' running' : '';
      const bg = cls ? '' : ';background:' + (COLOR[s.stage] || '#79747E');
      const label = s.state === 'aborted' ? s.attempt + '✗' : s.attempt + ' · ' + mmss(s.wallSec) + (s.costUsd ? ' · $' + s.costUsd : '');
      return '<div class="gbar' + cls + '" data-go="' + s.stage + '-' + s.attempt + '" style="left:' + l.toFixed(2) + '%;width:' + w.toFixed(2) + '%' + bg + '" title="' + esc(s.stage + ' ' + s.attempt + ' · ' + (s.status||s.state)) + '">' + esc(label) + '</div>';
    }).join('');
    return '<div class="grow"><div class="glab">' + esc(lane) + '</div><div class="gtrack">' + bars + '</div></div>';
  }).join('');
  const ticks = Array.from({length:7}, (_,i) => '<div class="gtick" style="left:' + (i/6*100) + '%">' + hhmm(D.t0 + span*i/6) + '</div>').join('');
  document.getElementById('gantt').innerHTML = rows + '<div class="gaxis">' + ticks + '</div>';
})();

/* ── rail ───────────────────────────────────────────────────────────── */
document.getElementById('rail').innerHTML = D.steps.map((s,i) => {
  const bad = s.findings.some(isBlocker) || s.state === 'aborted';
  const dot = s.script ? '#79747E' : (COLOR[s.stage] || '#79747E');
  return (i ? '<div class="connector"></div>' : '') +
    '<button class="stepitem" data-idx="' + i + '">' +
      '<span class="dot" style="background:' + dot + '">' + (s.script ? '·' : s.attempt) + '</span>' +
      '<span class="nm">' + esc(s.stage) + '<small>' + esc(s.model || (s.script ? 'скрипт' : '')) + '</small></span>' +
      '<span class="tm">' + (s.script ? '—' : mmss(s.wallSec)) + (bad ? ' ●' : '') + '</span>' +
    '</button>';
}).join('');

/* ── steps ──────────────────────────────────────────────────────────── */
function findingHtml(f) {
  const sev = isBlocker(f) ? 'blocker' : 'note';
  const w = f.witness;
  const deep = [
    w && w.detail ? '<div class="blk"><b>Свидетельство' + (w.kind ? ' · ' + esc(w.kind) : '') + '</b>' + esc(w.detail) + (w.source ? '<br><span class="mono dim">' + esc(w.source) + '</span>' : '') + '</div>' : '',
    f.suggestedFix ? '<div class="blk"><b>Предложенная починка</b>' + esc(f.suggestedFix) + '</div>' : '',
  ].join('');
  return '<div class="find ' + sev + '">' +
    '<div class="fh">' +
      '<span class="chip ' + (sev === 'blocker' ? 'c-block' : 'c-note') + '">' + esc(f.severity) + '</span>' +
      '<span class="chip c-' + esc(f.target) + '">→ ' + esc(f.target) + '</span>' +
      '<b>' + esc(f.id) + '</b>' +
      (f._carriedFrom ? '<span class="chip out">повтор из ' + esc(f._carriedFrom) + '</span>' : '') +
      '<span class="mono dim">' + esc(f.file || '') + (f.symbol ? '#' + esc(f.symbol) : '') + (f.line ? ':' + f.line : '') + '</span>' +
    '</div>' +
    '<div class="rule">' + esc(f.rule) + '</div>' +
    '<div class="claim">' + esc(f.claim) + '</div>' +
    (deep ? '<details><summary>Свидетельство и починка</summary><div class="deep">' + deep + '</div></details>' : '') +
  '</div>';
}

function routeHtml(s) {
  const bits = [];
  if (s.routedHere) bits.push('<div><span class="arrow">← пришло сюда:</span> ' + esc(s.routedHere.why) + '</div>');
  if (s.routing) {
    const prio = D.priority.map(t => '<i class="' + (t === s.routing.winner ? 'win' : '') + '">' + t + '</i>').join('');
    bits.push('<div style="margin-top:8px"><span class="arrow">Победил адрес:</span> <b>' + esc(s.routing.winner) + '</b>' +
      '<span class="prio">' + prio + '</span></div>' +
      (s.routing.why ? '<div style="margin-top:4px">' + esc(s.routing.why) + '</div>' : '') +
      '<div style="margin-top:4px">Причина маршрута: <b>' + s.routing.cause.join(', ') + '</b>' +
      (s.routing.alongside.length
        ? '. Поехали следом, не будучи причиной: ' + s.routing.alongside.map(a => a.id + ' (' + a.target + ')').join(', ')
        : '') + '</div>');
  }
  if (s.routedAway) bits.push('<div style="margin-top:8px"><span class="arrow">→ ушло в ' + esc(s.routedAway.to || s.routedAway.kind) + ':</span> ' + esc(s.routedAway.why) + '</div>');
  return bits.length ? '<div class="route">' + bits.join('') + '</div>' : '';
}

function paneReceived(s) {
  const meta = '<dl class="kv">' +
    '<dt>Агент</dt><dd>' + esc(s.agent || 'скрипт') + '</dd>' +
    '<dt>Модель</dt><dd>' + esc(s.model || '—') + '</dd>' +
    (s.resumedSession ? '<dt>Продолжает сессию</dt><dd>' + esc(s.resumedSession) + '</dd>' : '') +
    (s.sessionId ? '<dt>Своя сессия</dt><dd>' + esc(s.sessionId) + '</dd>' : '') +
    (s.fuseMin ? '<dt>Предохранитель</dt><dd>' + s.fuseMin + ' мин</dd>' : '') +
    (s.headAtStart ? '<dt>HEAD на старте</dt><dd>' + esc(s.headAtStart.slice(0,10)) + '</dd>' : '') +
  '</dl>';
  const prompt = s.prompt
    ? '<h4 style="margin:16px 0 8px;font-size:13px">Промпт, который получил агент</h4><pre class="txt">' + esc(s.prompt) + '</pre>'
    : '<div class="note-callout">Промпт не записан: этот прогон старше, чем захват входных данных в <span class="mono">ship.mjs</span>. У новых прогонов здесь будет ровно то, что видел агент.</div>';
  return routeHtml(s) + meta + prompt;
}

function paneDid(s) {
  const commits = s.commits && s.commits.length
    ? '<h4 style="margin:0 0 8px;font-size:13px">Коммиты в окне этого шага</h4><table><tr><th>SHA</th><th>Сообщение</th><th>Объём</th></tr>' +
      s.commits.map(c => '<tr><td class="mono">' + esc(c.sha) + '</td><td>' + esc(c.subject) + '</td><td class="dim">' + esc(c.stat) + '</td></tr>').join('') +
      '</table>'
    : '';
  const result = s.result
    ? '<h4 style="margin:16px 0 8px;font-size:13px">Заключительное сообщение агента</h4><div class="md">' + esc(s.result) + '</div>'
    : '<div class="empty">Заключительного сообщения нет' + (s.state === 'running' ? ' — шаг ещё идёт.' : s.state === 'aborted' ? ' — процесс был убит.' : '.') + '</div>';
  const report = s.report
    ? '<details style="margin-top:14px"><summary style="cursor:pointer;color:var(--primary);font-weight:500">Отчёт стадии целиком (' + s.report.length.toLocaleString('ru-RU') + ' символов)</summary><div class="md" style="margin-top:10px">' + esc(s.report) + '</div></details>'
    : '';
  return commits + result + report;
}

function paneVerdict(s) {
  if (!s.findings.length && !s.status) return '<div class="empty">Вердикта нет.</div>';
  const suites = s.suites ? '<h4 style="margin:14px 0 8px;font-size:13px">Прогоны тестов</h4><table><tr><th>Уровень</th><th>Результат</th><th>Комментарий</th></tr>' +
    ['unit','int','e2e'].map(k => {
      const x = s.suites[k]; if (!x) return '';
      const res = x.skipped ? '<span class="chip c-info">пропущен</span>'
        : (x.passed ?? 0) + ' ✓' + (x.failed ? ' / ' + x.failed + ' ✗' : '') + (x.ms ? ' · ' + (typeof x.ms === 'number' ? (x.ms/1000).toFixed(1) + ' с' : esc(x.ms)) : '');
      return '<tr><td><b>' + k + '</b></td><td>' + res + '</td><td class="dim" style="font-size:12px">' + esc(x.reason || x.note || (x.files||[]).join(', ')) + '</td></tr>';
    }).join('') + '</table>' : '';
  const cov = s.covered ? '<div class="note-callout"><b>Заявленное покрытие:</b> ' +
      (s.covered.files != null ? s.covered.files + ' из ' + (s.covered.of ?? '?') + ' файлов. ' : '') +
      esc(s.covered.note || '') +
      (s.coverageNamed != null ? '<br><b>Измеренное по журналу:</b> ' + s.coverageNamed + ' из ' + D.coverage.files + '.' : '') +
    '</div>' : (s.coverageNamed != null ? '<div class="note-callout"><b>Измеренное покрытие:</b> ' + s.coverageNamed + ' из ' + D.coverage.files + ' файлов дифа.</div>' : '');
  const bl = s.findings.filter(isBlocker), nt = s.findings.filter(f => !isBlocker(f));
  return routeHtml(s) + cov +
    (bl.length ? '<h4 style="margin:0 0 10px;font-size:13px">Блокеры — ' + bl.length + '</h4>' + bl.map(findingHtml).join('') : '') +
    (nt.length ? '<h4 style="margin:18px 0 10px;font-size:13px">Заметки — ' + nt.length + ' <span class="dim" style="font-weight:400">(не возвращают работу, копятся для человека)</span></h4>' + nt.map(findingHtml).join('') : '') +
    (!bl.length && !nt.length ? '<div class="empty">Находок нет — чистый ' + esc(s.status || '') + '.</div>' : '') + suites;
}

function paneTools(s) {
  if (!s.tools.length) return '<div class="empty">Вызовов инструментов в журнале нет.</div>';
  const mix = Object.entries(s.byTool).sort((a,b) => b[1]-a[1])
    .map(([t,n]) => '<span class="chip out">' + esc(t) + ' · ' + n + '</span>').join(' ');
  const rows = s.tools.map(t =>
    '<tr><td class="n">+' + t.at + 'с</td><td>' + esc(t.tool) + '</td><td class="n">' + (t.sec >= 1 ? t.sec + ' с' : '') + '</td>' +
    '<td class="mono" style="word-break:break-all">' + esc(t.what) + '</td></tr>').join('');
  return '<div style="margin-bottom:12px;display:flex;gap:6px;flex-wrap:wrap">' + mix + '</div>' +
    '<table><tr><th class="n">Смещение</th><th>Инструмент</th><th class="n">Длит.</th><th>Что</th></tr>' + rows + '</table>';
}

function paneMetrics(s) {
  const bar = '<div class="sr"><span>время шага</span><div class="sbar">' +
    '<i class="i-think" style="width:' + s.thinkPct + '%"></i><i class="i-tools" style="width:' + (100-s.thinkPct) + '%"></i>' +
    '</div><span class="n2">' + s.thinkPct + '% / ' + (100-s.thinkPct) + '%</span></div>';
  return bar + '<dl class="kv" style="margin-top:14px">' + [
    ['Состояние', s.state + (s.stopReason ? ' · ' + s.stopReason : '')],
    ['Wall', mmss(s.wallSec)],
    ['В API (размышление и генерация)', s.apiSec ? mmss(s.apiSec) : '—'],
    ['В инструментах', s.toolSec + ' с в ' + s.calls + ' вызовах'],
    ['Ходов', s.turns ?? '—'],
    ['Выходных токенов', nfmt(s.tokens.out) + (s.tokPerSec ? ' · ' + s.tokPerSec + ' ток/с' : '')],
    ['Кэш прочитан / записан', nfmt(s.tokens.cacheRead) + ' / ' + nfmt(s.tokens.cacheWrite)],
    ['Стоимость', s.costUsd ? '$' + s.costUsd : '—'],
    ['Артефакты', Object.entries(s.has).filter(([,v]) => v).map(([k]) => k).join(', ') || 'нет'],
  ].map(([k,v]) => '<dt>' + k + '</dt><dd>' + esc(v) + '</dd>').join('') + '</dl>';
}

const TABS = [
  ['Получил', paneReceived, s => s.prompt ? 1 : 0],
  ['Сделал', paneDid, s => (s.commits||[]).length],
  ['Вердикт', paneVerdict, s => s.findings.length],
  ['Инструменты', paneTools, s => s.calls],
  ['Метрики', paneMetrics, () => 0],
];

document.getElementById('steps').innerHTML = D.steps.map((s,i) => {
  const bl = s.findings.filter(isBlocker).length, nt = s.findings.length - bl;
  const color = COLOR[s.stage] || '#79747E';
  const sub = [
    s.model || (s.script ? 'скрипт-гейт' : ''),
    s.script ? null : mmss(s.wallSec) + ' (' + s.thinkPct + '% размышление)',
    s.costUsd ? '$' + s.costUsd : null,
    s.turns ? s.turns + ' ходов' : null,
    s.calls ? s.calls + ' вызовов инстр.' : null,
    s.resumedSession ? '↻ продолжает сессию' : null,
  ].filter(Boolean).join(' · ');
  const tabs = TABS.map(([name,,count], ti) => {
    const c = count(s);
    return '<button class="tab' + (ti===0?' on':'') + '" data-s="' + i + '" data-t="' + ti + '">' + name +
      (c ? '<span class="badge">' + c + '</span>' : '') + '</button>';
  }).join('');
  const panes = TABS.map(([,fn], ti) => '<div class="pane' + (ti===0?' on':'') + '" data-s="' + i + '" data-t="' + ti + '">' + (s.script && ti < 4 ? '<div class="empty">Скрипт-гейт: ни промпта, ни модели. Только вердикт.</div>' + (ti===2 ? paneVerdict(s) : '') : fn(s)) + '</div>').join('');
  return '<div class="card step" id="' + s.stage + '-' + s.attempt + '" data-idx="' + i + '"' +
    (bl ? ' data-bad="1"' : '') + (s.state !== 'done' ? ' data-odd="1"' : '') + '>' +
    '<button class="step-head"><span class="idx" style="background:' + color + '">' + (s.script ? '·' : s.attempt) + '</span>' +
      '<span><span class="ttl">' + esc(s.stage) + ' ' + s.attempt + ' ' + verdictChip(s.status) + ' ' + stateChip(s.state) +
        (bl ? '<span class="chip c-block">' + bl + ' блок.</span>' : '') +
        (nt ? '<span class="chip c-note">' + nt + ' зам.</span>' : '') +
      '</span><span class="sub">' + esc(sub) + '</span></span>' +
      '<span class="caret">▾</span></button>' +
    '<div class="panel"><div class="tabs">' + tabs + '</div>' + panes + '</div></div>';
}).join('');

/* ── interaction ────────────────────────────────────────────────────── */
const stepEls = [...document.querySelectorAll('.step')];
function openStep(i, scroll) {
  const el = stepEls[i]; if (!el) return;
  el.classList.add('open');
  document.querySelectorAll('.stepitem').forEach(b => b.classList.toggle('on', +b.dataset.idx === i));
  if (scroll) el.scrollIntoView({ block:'start' });
}
document.addEventListener('click', e => {
  const head = e.target.closest('.step-head');
  if (head) { const el = head.closest('.step'); el.classList.toggle('open');
    if (el.classList.contains('open')) openStep(+el.dataset.idx, false); return; }
  const tab = e.target.closest('.tab');
  if (tab) {
    const { s, t } = tab.dataset;
    document.querySelectorAll('.tab[data-s="' + s + '"]').forEach(b => b.classList.toggle('on', b.dataset.t === t));
    document.querySelectorAll('.pane[data-s="' + s + '"]').forEach(p => p.classList.toggle('on', p.dataset.t === t));
    return;
  }
  const item = e.target.closest('.stepitem');
  if (item) { openStep(+item.dataset.idx, true); return; }
  const bar = e.target.closest('[data-go]');
  if (bar) { const el = document.getElementById(bar.dataset.go); if (el) { el.classList.add('open'); openStep(+el.dataset.idx, true); } }
});

const FILTERS = [
  ['все', () => true],
  ['с блокерами', el => el.dataset.bad === '1'],
  ['незавершённые', el => el.dataset.odd === '1'],
];
document.getElementById('filters').innerHTML = FILTERS.map(([n],i) =>
  '<button class="fbtn' + (i===0?' on':'') + '" data-f="' + i + '">' + n + '</button>').join('') +
  '<span class="dim" style="margin-left:auto;font-size:12px">клик по полосе на диаграмме открывает шаг · j / k — следующий и предыдущий</span>';
document.getElementById('filters').addEventListener('click', e => {
  const b = e.target.closest('.fbtn'); if (!b) return;
  document.querySelectorAll('.fbtn').forEach(x => x.classList.toggle('on', x === b));
  const keep = FILTERS[+b.dataset.f][1];
  stepEls.forEach(el => { el.style.display = keep(el) ? '' : 'none'; });
});

let allOpen = false;
document.getElementById('toggleAll').addEventListener('click', e => {
  allOpen = !allOpen;
  stepEls.forEach(el => el.classList.toggle('open', allOpen));
  e.target.textContent = allOpen ? 'Свернуть всё' : 'Развернуть всё';
});

let cursor = 0;
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea')) return;
  if (e.key === 'j' || e.key === 'k') {
    cursor = Math.max(0, Math.min(stepEls.length - 1, cursor + (e.key === 'j' ? 1 : -1)));
    stepEls[cursor].classList.add('open'); openStep(cursor, true);
  }
});

/* ── routing log ────────────────────────────────────────────────────── */
document.getElementById('routing').innerHTML =
  '<p class="dim" style="margin-top:0">Порядок приоритета адресов — <span class="mono">' + D.priority.join(' → ') + '</span>. ' +
  'Один вердикт может нести блокеры с разными адресами, но маршрут берётся один: побеждает самый приоритетный из присутствующих, ' +
  'остальные едут следом. Текст в колонке «почему» написан самим роутером в момент решения.</p>' +
  '<table><tr><th class="n">Время</th><th>Откуда</th><th>Куда</th><th>Почему</th></tr>' +
  D.decisions.map(d => '<tr><td class="n">' + hhmm(d.at) + '</td><td>' + esc(d.from) + '</td>' +
    '<td>' + (d.to ? esc(d.to) : '<b>' + esc(d.kind) + '</b>') + '</td><td>' + esc(d.why) + '</td></tr>').join('') +
  '</table>';

/* ── think/tools split ──────────────────────────────────────────────── */
document.getElementById('split').innerHTML =
  '<p class="dim" style="margin-top:0">Время в API почти линейно по выходным токенам — ' + D.totals.tokPerSec +
  ' ток/с в среднем. Длительность ≈ токены ÷ ' + D.totals.tokPerSec + ' + инструменты (' + mmss(D.totals.apiSec) +
  ' + ' + mmss(D.totals.toolSec) + ' + ' + D.totals.orchestrationSec + ' с оркестрации = ' + mmss(D.totals.wallSec) + ').</p>' +
  D.steps.filter(s => !s.script && s.wallSec).map(s =>
    '<div class="sr"><span>' + esc(s.stage) + ' ' + s.attempt + '</span><div class="sbar">' +
    '<i class="i-think" style="width:' + s.thinkPct + '%"></i><i class="i-tools" style="width:' + (100-s.thinkPct) + '%"></i>' +
    '</div><span class="n2">' + s.toolSec + ' с инстр.</span></div>').join('');

/* ── stages ─────────────────────────────────────────────────────────── */
document.getElementById('stages').innerHTML =
  '<table><tr><th>Стадия</th><th>Модель</th><th class="n">Вызовов</th><th class="n">Wall</th><th class="n">Ходов</th>' +
  '<th class="n">Токенов</th><th class="n">% ток.</th><th class="n">$</th><th class="n">% денег</th><th class="n">Размышл.</th></tr>' +
  D.byStage.map(b => '<tr><td>' + esc(b.stage) + '</td><td class="mono">' + esc(b.model||'') + '</td>' +
    '<td class="n">' + b.invocations + '</td><td class="n">' + mmss(b.wallSec) + '</td><td class="n">' + b.turns + '</td>' +
    '<td class="n">' + nfmt(b.outTokens) + '</td><td class="n">' + pctOf(b.outTokens, D.totals.outTokens) + '%</td>' +
    '<td class="n">' + b.costUsd.toFixed(2) + '</td><td class="n">' + pctOf(b.costUsd*100, D.totals.costUsd*100) + '%</td>' +
    '<td class="n">' + pctOf(b.wallSec-b.toolSec, b.wallSec) + '%</td></tr>').join('') + '</table>';

/* ── coverage ───────────────────────────────────────────────────────── */
document.getElementById('cov').innerHTML =
  D.coverage.perPass.map(p => '<div class="sr"><span>review ' + p.attempt + '</span>' +
    '<div class="sbar"><i class="i-tools" style="width:' + pctOf(p.named, D.coverage.files) + '%"></i></div>' +
    '<span class="n2">' + p.named + ' / ' + D.coverage.files + '</span></div>').join('') +
  '<p style="margin-top:14px">Ни одним проходом не названы: <b>' + D.coverage.never.length + '</b> из ' + D.coverage.files + '.</p>' +
  (D.coverage.never.length ? '<table><tr><th class="n">Строк</th><th>Файл</th></tr>' +
    D.coverage.never.map(f => '<tr><td class="n">' + f.lines + '</td><td class="mono">' + esc(f.path) + '</td></tr>').join('') + '</table>' : '') +
  '<p class="dim" style="font-size:12px">Файл считается названным, когда его путь встретился в собственном вызове инструмента ревью. ' +
  'Пути нормализуются: <span class="mono">Read</span> на Windows отдаёт абсолютный путь с обратными слэшами, и без нормализации ' +
  'реестр не засчитывает ни одного чтения.</p>';

if (D.steps.length) openStep(0, false);
</script>
</body></html>
