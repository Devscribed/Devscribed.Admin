<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0;background:var(--paper-100);color:var(--text);font-family:var(--font-text);}
.wrap{padding:20px 22px;display:flex;flex-direction:column;gap:18px;}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;align-items:start;}
.lbl{font-family:var(--font-display);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-faint);margin-bottom:2px;}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head><body><div class="wrap" id="root"></div>
<script type="text/babel" data-presets="react">
const NS = window.TeammerlyMeridianDesignSystem_063f40 || {};
const { Input, Select, Checkbox, Radio, RadioGroup, SearchField } = NS;
const opts = [{value:'acme',label:'Acme'},{value:'nova',label:'Nova'},{value:'north',label:'Northwind'}];
const App = () => {
  const [c, setC] = React.useState('acme');
  const [bill, setBill] = React.useState(true);
  const [mode, setMode] = React.useState('auto');
  return (
    <div style={{display:'flex',flexDirection:'column',gap:20}}>
      <div>
        <div className="lbl">Text input — default · focus · filled · error · disabled</div>
        <div className="row">
          <Input label="Project name" placeholder="Enter a name" />
          <Input label="Rate" defaultValue="120.00" />
          <Input label="Rate" error="Required" placeholder="0.00" />
        </div>
        <div className="row" style={{marginTop:12}}>
          <SearchField placeholder="Search members…" />
          <Input label="Timezone" defaultValue="Europe/London" disabled />
          <Select label="Client" value={c} onChange={setC} options={opts} />
        </div>
      </div>
      <div>
        <div className="lbl">Select — error · disabled</div>
        <div className="row">
          <Select label="Client" value="" onChange={()=>{}} options={opts} error="Pick a client" />
          <Select label="Client" value={c} onChange={setC} options={opts} disabled />
          <div />
        </div>
      </div>
      <div>
        <div className="lbl">Checkbox &amp; Radio — selected · unselected · disabled</div>
        <div style={{display:'flex',gap:32,alignItems:'flex-start',flexWrap:'wrap'}}>
          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            <Checkbox checked={bill} onChange={setBill} label="Billable" />
            <Checkbox checked={false} onChange={()=>{}} label="Send weekly summary" />
            <Checkbox checked onChange={()=>{}} label="Locked (disabled)" disabled />
          </div>
          <RadioGroup value={mode} onChange={setMode} options={[
            {value:'auto',label:'Automatic reserve'},
            {value:'manual',label:'Manual reserve'},
            {value:'off',label:'Disabled option',disabled:true},
          ]} />
        </div>
      </div>
    </div>
  );
};
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
