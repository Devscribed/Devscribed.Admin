<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="./styles.css">
<style>html,body{margin:0;height:100%;font-family:var(--font-display);}
.page{width:1280px;height:854px;display:flex;}
.main{flex:1;background:var(--violet-700);display:flex;align-items:center;justify-content:center;}
.mark{font-weight:600;font-size:190px;letter-spacing:-6px;color:#fff;line-height:.9;}
.mark .pin{display:inline-block;width:34px;height:34px;border-radius:8px;background:var(--amber-500);margin-left:10px;vertical-align:middle;box-shadow:0 0 30px oklch(0.78 0.14 74 / .55);}
.strip{width:22%;display:flex;flex-direction:column;}
.strip>div{flex:1;}</style></head>
<body><div class="page">
  <div class="main"><div class="mark">Meridian<span class="pin"></span></div></div>
  <div class="strip">
    <div style="background:var(--paper-100);"></div>
    <div style="background:var(--amber-500);"></div>
    <div style="background:var(--violet-500);"></div>
    <div style="background:var(--char-0);"></div>
  </div>
</div></body></html>
