<!-- @dsCard group="Brand" viewport="700x180" name="Motion" subtitle="Fast, no bounce — colors ease, transforms snap" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--paper-100);color:var(--text);font-family:var(--font-text);}
.wrap{padding:18px 22px;box-sizing:border-box;height:100%;}</style></head>
<body><div class="wrap"><div style="font-family:var(--font-text);font-size:13px;color:var(--ink-700);line-height:1.6;">
    <div><b style="font-family:var(--font-display);">120ms</b> — cursor-driven color shifts (hover, focus).</div>
    <div><b style="font-family:var(--font-display);">150ms</b> — background transitions on nav & rows.</div>
    <div><b style="font-family:var(--font-display);">200ms</b> — chevron rotations, disclosure.</div>
    <div><b style="font-family:var(--font-display);">250ms</b> — theme switch (bg + color).</div>
    <div style="font-family:var(--font-display);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-500);margin-top:14px;">EASING</div>
    <div>cubic-bezier(.4, 0, .2, 1) — no bounces, no elastic.</div>
  </div></div></body></html>
