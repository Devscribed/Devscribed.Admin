<!-- @dsCard group="Colors" viewport="700x200" name="Semantic" subtitle="Status, tracker, feedback" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--paper-100);color:var(--text);font-family:var(--font-text);}
.wrap{padding:18px 22px;box-sizing:border-box;height:100%;}</style></head>
<body><div class="wrap"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;">
    <div><div style="height:52px;border-radius:10px;background:var(--success-500);"></div><div style="font-family:var(--font-text);font-size:11px;color:var(--ink-500);margin-top:6px;">Success</div><div style="font-family:var(--font-display);font-size:10px;letter-spacing:.5px;color:var(--ink-400);margin-top:1px;">green</div></div>
    <div><div style="height:52px;border-radius:10px;background:var(--amber-500);"></div><div style="font-family:var(--font-text);font-size:11px;color:var(--ink-500);margin-top:6px;">Tracker · Warning</div><div style="font-family:var(--font-display);font-size:10px;letter-spacing:.5px;color:var(--ink-400);margin-top:1px;">amber</div></div>
    <div><div style="height:52px;border-radius:10px;background:var(--error-500);"></div><div style="font-family:var(--font-text);font-size:11px;color:var(--ink-500);margin-top:6px;">Error</div><div style="font-family:var(--font-display);font-size:10px;letter-spacing:.5px;color:var(--ink-400);margin-top:1px;">red</div></div>
    <div><div style="height:52px;border-radius:10px;background:var(--violet-700);"></div><div style="font-family:var(--font-text);font-size:11px;color:var(--ink-500);margin-top:6px;">Info</div><div style="font-family:var(--font-display);font-size:10px;letter-spacing:.5px;color:var(--ink-400);margin-top:1px;">violet</div></div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:14px;">
    <div><div style="height:52px;border-radius:10px;background:var(--success-100);"></div><div style="font-family:var(--font-text);font-size:11px;color:var(--ink-500);margin-top:6px;">100</div><div style="font-family:var(--font-display);font-size:10px;letter-spacing:.5px;color:var(--ink-400);margin-top:1px;">soft</div></div>
    <div><div style="height:52px;border-radius:10px;background:var(--success-700);"></div><div style="font-family:var(--font-text);font-size:11px;color:var(--ink-500);margin-top:6px;">700</div><div style="font-family:var(--font-display);font-size:10px;letter-spacing:.5px;color:var(--ink-400);margin-top:1px;">deep</div></div>
    <div><div style="height:52px;border-radius:10px;background:var(--amber-100);"></div><div style="font-family:var(--font-text);font-size:11px;color:var(--ink-500);margin-top:6px;">100</div><div style="font-family:var(--font-display);font-size:10px;letter-spacing:.5px;color:var(--ink-400);margin-top:1px;">soft</div></div>
    <div><div style="height:52px;border-radius:10px;background:var(--amber-700);"></div><div style="font-family:var(--font-text);font-size:11px;color:var(--ink-500);margin-top:6px;">700</div><div style="font-family:var(--font-display);font-size:10px;letter-spacing:.5px;color:var(--ink-400);margin-top:1px;">deep</div></div>
    <div><div style="height:52px;border-radius:10px;background:var(--error-100);"></div><div style="font-family:var(--font-text);font-size:11px;color:var(--ink-500);margin-top:6px;">100</div><div style="font-family:var(--font-display);font-size:10px;letter-spacing:.5px;color:var(--ink-400);margin-top:1px;">soft</div></div>
    <div><div style="height:52px;border-radius:10px;background:var(--error-700);"></div><div style="font-family:var(--font-text);font-size:11px;color:var(--ink-500);margin-top:6px;">700</div><div style="font-family:var(--font-display);font-size:10px;letter-spacing:.5px;color:var(--ink-400);margin-top:1px;">deep</div></div>
  </div></div></body></html>
