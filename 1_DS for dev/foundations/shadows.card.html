<!-- @dsCard group="Brand" viewport="700x260" name="Shadows & lips" subtitle="Warm brown-cast, always paired with a border" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--paper-100);color:var(--text);font-family:var(--font-text);}
.wrap{padding:18px 22px;box-sizing:border-box;height:100%;}</style></head>
<body><div class="wrap"><div style="display:flex;gap:16px;flex-wrap:wrap;font-family:var(--font-text);font-size:12px;color:var(--ink-700);">
    <div style="flex:1 1 140px;background:var(--paper-100);padding:14px;border-radius:10px;"><div style="height:72px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-card);"></div><div style="margin-top:8px;font-family:var(--font-display);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-500);">CARD</div>0 2/4 · 0 20/40 · brown</div>
    <div style="flex:1 1 140px;background:var(--paper-100);padding:14px;border-radius:10px;"><div style="height:72px;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-modal);"></div><div style="margin-top:8px;font-family:var(--font-display);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-500);">MODAL</div>heavier drop</div>
    <div style="flex:1 1 140px;background:var(--paper-100);padding:14px;border-radius:10px;"><div style="height:44px;background:var(--violet-700);border-radius:9px;box-shadow:var(--lip-accent);"></div><div style="margin-top:8px;font-family:var(--font-display);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-500);">TACTILE LIP</div>2px on rest → 1px on press</div>
    <div style="flex:1 1 140px;background:var(--paper-100);padding:14px;border-radius:10px;"><div style="height:44px;background:#fff;border:1.5px solid var(--violet-700);border-radius:9px;box-shadow:var(--shadow-glow-accent);"></div><div style="margin-top:8px;font-family:var(--font-display);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-500);">FOCUS RING</div>0 0 0 3px accent-100</div>
  </div></div></body></html>
