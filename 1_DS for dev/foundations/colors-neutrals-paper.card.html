<!-- @dsCard group="Colors" viewport="700x180" name="Neutrals — Paper" subtitle="Warm backgrounds & borders" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--paper-100);color:var(--text);font-family:var(--font-text);}
.wrap{padding:18px 22px;box-sizing:border-box;height:100%;}</style></head>
<body><div class="wrap"><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px;">
    <div><div style="height:52px;border-radius:10px;background:var(--paper-0);border:1px solid var(--border);"></div><div style="font-family:var(--font-text);font-size:11px;color:var(--ink-500);margin-top:6px;">0</div><div style="font-family:var(--font-display);font-size:10px;letter-spacing:.5px;color:var(--ink-400);margin-top:1px;">#FFF</div></div>
    <div><div style="height:52px;border-radius:10px;background:var(--paper-50);"></div><div style="font-family:var(--font-text);font-size:11px;color:var(--ink-500);margin-top:6px;">50</div><div style="font-family:var(--font-display);font-size:10px;letter-spacing:.5px;color:var(--ink-400);margin-top:1px;">#FBF8F2</div></div>
    <div><div style="height:52px;border-radius:10px;background:var(--paper-100);"></div><div style="font-family:var(--font-text);font-size:11px;color:var(--ink-500);margin-top:6px;">100 · bg</div><div style="font-family:var(--font-display);font-size:10px;letter-spacing:.5px;color:var(--ink-400);margin-top:1px;">#F7F3EC</div></div>
    <div><div style="height:52px;border-radius:10px;background:var(--paper-200);"></div><div style="font-family:var(--font-text);font-size:11px;color:var(--ink-500);margin-top:6px;">200 · sunken</div><div style="font-family:var(--font-display);font-size:10px;letter-spacing:.5px;color:var(--ink-400);margin-top:1px;">#F0EADF</div></div>
    <div><div style="height:52px;border-radius:10px;background:var(--paper-500);"></div><div style="font-family:var(--font-text);font-size:11px;color:var(--ink-500);margin-top:6px;">500 border</div><div style="font-family:var(--font-display);font-size:10px;letter-spacing:.5px;color:var(--ink-400);margin-top:1px;">#E4DBCC</div></div>
    <div><div style="height:52px;border-radius:10px;background:var(--paper-600);"></div><div style="font-family:var(--font-text);font-size:11px;color:var(--ink-500);margin-top:6px;">600 border</div><div style="font-family:var(--font-display);font-size:10px;letter-spacing:.5px;color:var(--ink-400);margin-top:1px;">#DBCFB9</div></div>
  </div></div></body></html>
