<!-- @dsCard group="Brand" viewport="700x200" name="The one hover" subtitle="Every row/menu/cell shares the accent tint" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--paper-100);color:var(--text);font-family:var(--font-text);}
.wrap{padding:18px 22px;box-sizing:border-box;height:100%;}</style></head>
<body><div class="wrap"><style>.hh{padding:9px 14px;border-radius:8px;font-family:var(--font-text);font-size:14px;color:var(--ink-900);cursor:pointer;transition:background .15s;}.hh:hover{background:var(--hover-bg-tint)}</style>
  <div style="display:flex;flex-direction:column;">
    <div class="hh" style="font-family:var(--font-display);font-weight:500;font-size:15px;">Nav menu item</div>
    <div class="hh" style="margin-left:22px;">Sub-menu item</div>
    <div class="hh">Dropdown option</div>
    <div style="display:flex;gap:6px;padding:4px 0;">
      <div class="hh" style="width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:500;font-size:13px;">17</div><div class="hh" style="width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:500;font-size:13px;">18</div><div class="hh" style="width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:500;font-size:13px;">19</div>
      <span style="align-self:center;margin-left:6px;font-family:var(--font-text);font-size:12px;color:var(--ink-400);">calendar cells</span>
    </div>
    <div class="hh">09:30 AM &nbsp;<span style="color:var(--ink-400);">time slot</span></div>
  </div></div></body></html>
