services:
  postgres:
    image: postgres:16-alpine
    container_name: devscribed-admin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devscribed
      POSTGRES_PASSWORD: devscribed
      POSTGRES_DB: devscribed_admin
    # Host port 5433 (not 5432) to avoid clashing with a native Postgres install.
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devscribed -d devscribed_admin']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
