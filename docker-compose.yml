# Local Postgres for development and the integration suite. Production runs on Neon,
# which speaks the same wire protocol, so this is the same connection path — only the
# host differs.
#
#   docker compose up -d
#
# Two databases on one server: the test suite resets its schema on every run
# (apps/api/test/global-setup.ts), which would otherwise wipe whatever you were
# looking at in dev.
services:
  postgres:
    image: postgres:17-alpine
    container_name: devscribed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devscribed
      POSTGRES_PASSWORD: devscribed
      POSTGRES_DB: devscribed_dev
    ports:
      # 5433 on the host: a plain 5432 collides with whatever local Postgres a developer
      # already has running. Inside the container it is still the standard port.
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, on an empty data volume — see the note in the script itself.
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-create-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devscribed -d devscribed_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  # Browser UI for the database above, on http://localhost:5050. Purely a convenience —
  # nothing in the app or the test suite depends on it.
  pgadmin:
    image: dpage/pgadmin4:9
    container_name: devscribed-pgadmin
    restart: unless-stopped
    environment:
      # Desktop mode: no login screen and no master password, because the only thing
      # this instance can reach is a throwaway local database. The credentials below are
      # still required by the image's entrypoint even when it never asks for them.
      PGADMIN_DEFAULT_EMAIL: dev@devscribed.com
      PGADMIN_DEFAULT_PASSWORD: devscribed
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGADMIN_LISTEN_PORT: 80
    ports:
      - '5050:80'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      # Pre-registers the connection, so the server is already in the tree on first open.
      # Imported once, on an empty pgadmin-data volume. The password is not part of it —
      # enter `devscribed` on the first connect and tick "Save password".
      - ./docker/pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  pgadmin-data:
